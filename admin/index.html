<style>
/* CM 학원관리 (/admin/) — 접두어 am- */
:root{--red:#C8202F;--red2:#9E1824;--redbg:#FDE8EA;--cream:#FFF7F4;--ink:#1F2430;--ink2:#5B6170;--line:#E7E3E1;--line2:#F0EEED;--bg:#F6F6F7;--blue:#2563EB;--bluebg:#E8F0FE;--blue2:#1D4ED8;--org:#B45309;--orgbg:#FEF3E2;--org2:#92400E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red)}
.am-hd{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.am-hd-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.am-logo img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:10px;display:block}
.am-logo{overflow:hidden;flex:none;width:36px;height:36px;border-radius:10px;background:var(--red);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.am-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.am-nav{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 auto}
.am-nav button{border:0;background:none;font-weight:700;font-size:15px;padding:9px 14px;border-radius:999px;min-height:40px;cursor:pointer}
.am-nav button[aria-current="page"]{background:var(--red);color:#fff}
.am-who{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.am-main{max-width:1280px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:20px}
.am-h1{margin:0;font-size:24px;font-weight:800}
.am-sub{font-size:14px;color:var(--ink2);margin:4px 0 0}
.am-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.am-card h2{margin:0 0 12px;font-size:18px;font-weight:800}
.am-row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.am-side{flex:1 1 260px;min-width:0}
.am-body{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
.am-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.am-stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;min-height:110px}
.am-stat .l{font-size:14px;font-weight:700;color:var(--ink2)}
.am-stat .n{font-size:38px;font-weight:800;line-height:1.1}
.am-btn{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.am-btn:hover{background:var(--red2)}
.am-btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.am-btn.ghost:hover{background:var(--bg)}
.am-btn.dash{background:#fff;color:var(--red2);border:1px dashed var(--red)}
.am-btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.am-btn.danger{background:#fff;color:var(--red2);border:1px solid var(--line)}
.am-btn:disabled{opacity:.5;cursor:default}
.am-pill{display:inline-block;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--line2);white-space:nowrap}
.am-pill.red{background:var(--redbg);color:var(--red2)}.am-pill.blue{background:var(--bluebg);color:var(--blue2)}.am-pill.org{background:var(--orgbg);color:var(--org2)}
.am-item{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#FAFAFA;border:1px solid var(--line2)}
.am-item .grow{flex:1 1 200px;font-weight:700}
.am-pick{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;cursor:pointer;text-align:left}
.am-pick[aria-pressed="true"]{border:2px solid var(--red);background:var(--cream)}
.am-list{display:flex;flex-direction:column;gap:8px}
.am-lbl{font-size:14px;font-weight:700;color:var(--ink2)}
.am-f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.am-f input[type=text],.am-f input[type=password],.am-f select{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.am-chk{display:flex;flex-wrap:wrap;gap:8px}
.am-chk label{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:#fff}
.am-chk input{width:18px;height:18px;accent-color:var(--red)}
.am-perm{display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 0;border-top:1px solid var(--line2)}
.am-perm .t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.am-perm .t small{font-size:13px;color:var(--ink2)}
.am-perm .t small.own{color:var(--red2)}
.am-sw{width:56px;height:32px;border-radius:99px;border:0;padding:3px;display:flex;align-items:center;cursor:pointer;background:#CFCBC9;flex:none}
.am-sw span{width:26px;height:26px;border-radius:99px;background:#fff;display:block}
.am-sw[aria-checked="true"]{background:var(--blue);justify-content:flex-end}
.am-seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.am-seg button{border:0;background:#fff;min-height:40px;padding:0 12px;font-size:14px;font-weight:700;cursor:pointer}
.am-seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.am-note{font-size:13px;color:var(--ink2)}
.am-empty{text-align:center;color:var(--ink2);font-size:14px;padding:28px 0}
.am-modal{position:fixed;inset:0;background:rgba(31,36,48,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.am-modal>div{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.am-modal h3{margin:0 0 14px;font-size:19px;font-weight:800}
.am-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.am-stu{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.am-stu .nm{font-size:18px;font-weight:800}
.am-stu .meta{font-size:14px;color:var(--ink2)}
.am-stu .memo{font-size:14px;background:var(--bg);border-radius:10px;padding:8px 10px;white-space:pre-wrap}
.am-hist{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.am-hist div{font-size:14px;background:#FAFAFA;border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.am-login{max-width:400px;margin:10vh auto;padding:0 20px}
.am-login .am-card{padding:28px}
.am-err{color:var(--red2);font-size:14px;min-height:20px;margin:6px 0}
.am-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:60}
.am-tree{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.am-tree>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;cursor:pointer;font-weight:800;background:#FAFAFA}
.am-tree>summary::-webkit-details-marker{display:none}
.am-tree .kids{padding:6px 14px 10px;display:flex;flex-direction:column}
.am-tree label{display:flex;align-items:center;gap:8px;min-height:40px;font-size:15px}
.am-tree input{width:18px;height:18px;accent-color:var(--red);flex:none}
.am-ol{list-style:decimal;margin:0;padding-left:22px;line-height:2}
.am-tt{display:grid;grid-template-columns:56px 56px 1fr;align-items:center;gap:6px;min-height:40px;font-size:15px}
.am-tt input{width:20px;height:20px;justify-self:center}
.am-att{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
.am-att .nm{flex:1 1 140px;font-weight:700;font-size:16px}
.am-att button{min-width:60px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.am-att button[aria-pressed="true"].a{background:var(--blue);color:#fff;border-color:var(--blue)}
.am-att button[aria-pressed="true"].l{background:var(--org);color:#fff;border-color:var(--org)}
.am-att button[aria-pressed="true"].x{background:var(--red);color:#fff;border-color:var(--red)}
.am-fb{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line2)}
.am-fb .r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.am-fb input[type=text]{min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;width:100%}
.am-rep{display:flex;flex-direction:column;gap:8px}
.am-kv{font-size:14px;color:var(--ink2)} .am-kv b{color:var(--ink)}
.am-link{background:none;border:0;padding:0;color:var(--red);font-weight:700;cursor:pointer;text-align:left}
.hidden{display:none!important}
@media (max-width:640px){.am-h1{font-size:21px}.am-stat .n{font-size:32px}}
</style>
</head>
<body>
<div id="am-login" class="am-login hidden">
  <div class="am-card">
    <div class="am-brand" style="margin-bottom:6px"><div class="am-logo">CM</div>CM 학원관리</div>
    <p class="am-sub" style="margin-bottom:18px">원장 · 지점 원장 · 강사 · 행정 담당자 로그인</p>
    <form id="am-login-form">
      <div class="am-f"><label class="am-lbl" for="am-id">아이디</label><input type="text" id="am-id" autocomplete="username" autocapitalize="off" required></div>
      <div class="am-f"><label class="am-lbl" for="am-pw">비밀번호</label><input type="password" id="am-pw" autocomplete="current-password" required></div>
      <div id="am-login-err" class="am-err" role="alert"></div>
      <button type="submit" class="am-btn" style="width:100%">로그인</button>
    </form>
    <p class="am-note" style="margin-top:14px">학생은 <a href="/">CMVOCA 학습 앱</a>을 사용합니다.</p>
  </div>
</div>

<div id="am-app" class="hidden">
  <header class="am-hd"><div class="am-hd-in">
    <div class="am-brand"><div class="am-logo" id="am-logo">CM</div><span id="am-acad">CM 학원관리</span></div>
    <nav id="am-nav" class="am-nav" aria-label="주 메뉴"></nav>
    <div class="am-who">
      <label id="am-br-wrap" class="hidden" style="display:flex;align-items:center;gap:6px">지점 <select id="am-br" style="min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:#fff"></select></label>
      <span id="am-me"></span>
      <a id="am-old" class="am-btn ghost sm hidden" href="/">CMVOCA 앱</a>
      <button type="button" id="am-out" class="am-btn ghost sm">로그아웃</button>
    </div>
  </div></header>
  <main id="am-main" class="am-main"></main>
</div>

<script>
'use strict';
/* 운영 화면(ops.js)이 함께 쓰는 연결점 */
window.AM = { toast: m => toast(m), me: () => A.me, branches: () => A.branches.filter(b => b.id !== 'main'), bid: () => A.bid, brand: () => brand(), hq: () => A.hqName || '', setHq: v => { A.hqName = v; brand(); } };
/* ===== 설정 (CMVOCA index.html 과 같은 Firebase 프로젝트·로그인) ===== */
const FB = {
  apiKey: 'AIzaSyDtXLBEPEa89bst8lJWJ8ayCUJgyaf7PS4',
  authDomain: 'cm-academy-8387b.firebaseapp.com',
  projectId: 'cm-academy-8387b',
  storageBucket: 'cm-academy-8387b.firebasestorage.app',
  messagingSenderId: '371199594988',
  appId: '1:371199594988:web:a74f2bd1cc853d15d4f0c9'
};
const DOMAIN = '@cmacademy.com', ADMIN_ID = 'admin';
const SUBJ = ['수학', '영어', '국어', '과학', '사회', '한국사', '기타'];
const DEF_GRADES = ['초1', '초2', '초3', '초4', '초5', '초6', '중1', '중2', '중3', '고1', '고2', '고3'];
// 원장이 강사에게 공개·비공개로 정하는 기능
const PERMS = [['learn', '학습 상태 보기 (기록·점수·오답)'], ['counsel', '상담 기록 보기'], ['hw', '숙제 내기'], ['weekly', '주간평가 내기'], ['monthly', '월말평가 내기']];
const PDEF = { learn: true, counsel: false, hw: true, weekly: true, monthly: false };
// 강사가 항상 할 수 있는 일 (안내용)
const ALWAYS = '출결 입력 · 오늘 진도 체크 · 다음 진도 예정 체크 · 학생별 한마디 · 수업 보고서(출퇴근)';
// 행정 담당자 메뉴 권한 체크리스트
const STAFF_MENUS = [['stu', '학생 정보·연락처'], ['att', '출결'], ['counsel', '상담'], ['fee', '회비·수납'], ['ledger', '수입·지출'], ['tpay', '강사 출퇴근·급여'], ['plan', '일정'], ['notice', '공지'], ['exam', '숙제·평가 출제'], ['stats', '통계'], ['assign', '강사 학생 지정·공개 설정']];
// 학습 기록의 과목: 폴더(B 영어·C 수학·D 국어) 우선, 없으면 제목의 낱말
const FOLDER_SUBJ = { B: '영어', C: '수학', D: '국어' };
// CMVOCA 학습 자료실의 큰 폴더 (학원관리 F·PDF 자료 제외). kind: branch=지점 전용, shared=공유 선택, all=전체 공개
const ROOTS = [['A', 'A · 우리 지점 전용', 'branch'], ['B', 'B · 영어', 'shared'], ['C', 'C · 수학', 'shared'], ['D', 'D · 국어', 'shared'], ['E', 'E · 전과목 통합', 'all']];
const NONE = '_none';
const KEEP = 30 * 24 * 3600 * 1000; // 출결 기록 보관 30일 (CMVOCA와 같음)
// 행정 담당자: 운영 화면 탭 → 필요한 권한
const TAB_PERM = { stu: 'stu', grade: 'stu', counsel: 'counsel', progress: 'stu', teacher: 'tpay', tclk: 'tpay', pay: 'tpay', klass: 'plan', sum: 'ledger', fee: 'fee', plan: 'plan', school: 'plan', att: 'att', etc: 'stats' }; // 강사 기본값: 아무 폴더도 안 보임 (원장이 고른 폴더만 보이게)
const SUBJ_WORDS = { 수학: ['수학', 'SUHAK', '대수', '함수', '방정식'], 영어: ['영어', '단어', '문법', '구문', 'VOCA', 'MUNBEOP', 'GUMUN', 'EOHWI', '독해'], 국어: ['국어', 'GUGEO', '문학', '비문학'], 과학: ['과학', 'GWAHAK'], 사회: ['사회'], 한국사: ['한국사', '역사'] };

const configured = typeof firebase !== 'undefined';
if (configured) firebase.initializeApp(FB);
const auth = configured ? firebase.auth() : null, db = configured ? firebase.firestore() : null;
const auth2 = configured ? firebase.initializeApp(FB, 'sec').auth() : null; // 로그인 유지한 채 새 계정 만들기

/* ===== 공용 ===== */
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const btn = (text, cls, fn, extra) => h('button', { type: 'button', class: 'am-btn ' + (cls || ''), onclick: fn, ...(extra || {}) }, text);
let toastT = null;
function toast(m, ms) { let t = $('am-toast'); if (!m) { if (t) t.remove(); return; } if (!t) { t = h('div', { id: 'am-toast', class: 'am-toast', role: 'status' }); document.body.append(t); } t.textContent = m; clearTimeout(toastT); if (ms) toastT = setTimeout(() => toast(''), ms); }
async function safe(fn) { try { return await fn(); } catch (e) { console.error(e); toast(''); alert('오류: ' + (e && e.code === 'permission-denied' ? '권한이 없습니다. (새 보안 규칙이 적용되었는지 확인해 주세요)' : (e.message || e))); } }
const dayOf = ts => { const d = new Date(ts), z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
const today = () => dayOf(Date.now());
const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'ko');

/* ===== 상태 ===== */
const A = { me: null, role: null, bid: null, branches: [], view: null, sel: null, cache: {} };
const isBoss = () => A.role === 'super' || A.role === 'sub';
const staffCan = k => A.role === 'staff' && A.staffPerm && (A.staffPerm.all || (A.staffPerm.menus || {})[k]);

/* ===== 학원관리(mg) 읽기·쓰기 ===== */
async function mgGet(kind) {
  const q = await db.collection('mg').where('branchId', '==', A.bid).where('kind', '==', kind).get();
  return q.docs.map(d => ({ id: d.id, ...d.data() }));
}
const mgSet = (id, data) => db.collection('mg').doc(id).set({ ...data, branchId: A.bid }, { merge: true });
const mgDel = id => db.collection('mg').doc(id).delete();

async function loadCfg() {
  const r = (await mgGet('cfg'))[0];
  return { grades: r && r.grades && r.grades.length ? r.grades : DEF_GRADES.slice() };
}
// 학생 명부: 학습 계정 학생(users) + 계정 없는 학생(mg stu). 강사 화면에서는 개인정보를 쓰지 않는다.
async function loadRoster() {
  const u = await db.collection('users').where('branchId', '==', A.bid).where('role', '==', 'student').get();
  const acct = u.docs.map(d => { const x = d.data(); return { id: d.id, name: x.name || '', grade: x.grade || '', school: x.school || '', acct: true }; });
  const extra = (await mgGet('stu')).map(r => ({ id: r.id, name: r.name || '', grade: r.grade || '', school: r.school || '', className: r.className || '', subject: r.subject || '', memo: r.memo || '', phone: r.phone || '', reg: r.reg || '', acct: false }));

// 원장이 고른 학습 폴더(users.allow) 안의 자료만 진도 목록으로 씀 (CMVOCA와 같은 규칙)
function allowFilter(items, root, allow) {
  if (!allow || !allow.length || allow.includes(root)) return items;
  const sel = new Set(allow), byId = new Map(items.map(i => [i.id, i])), show = new Set(), up = it => (it.parentId ? byId.get(it.parentId) : null);
  items.forEach(it => { let p = it, n = 0, hit = false; while (p && n++ < 100) { if (sel.has(p.id)) { hit = true; break; } p = up(p); } if (!hit) return; p = it; n = 0; while (p && n++ < 100 && !show.has(p.id)) { show.add(p.id); p = up(p); } });
  return items.filter(i => show.has(i.id));
}
async function myUnits() {
  const allow = A.me.allow || [], roots = allow.length ? ROOTS.filter(r => (A.me.allowRoots || []).includes(r[0]) || allow.includes(r[0])) : ROOTS;
  const out = [];
  for (const [rid, rname, kind] of roots) {
    let q = db.collection('items').where('folder', '==', rid);
    if (kind === 'branch') q = q.where('branchId', '==', A.bid).where('visible', '==', true);
    else if (kind === 'shared') q = q.where('shared', 'array-contains', A.bid);
    let items = [];
    try { items = (await q.get()).docs.map(d => ({ id: d.id, ...d.data() })).filter(i => !i.deleted && !i.pdfUrl); } catch (_) {}
    items = allowFilter(items, rid, allow);
    if (items.length) out.push({ rid, rname, items });
  }
  return out;
}

    if (perm.learn) {
      const out = h('div', { class: 'am-hist' });
      const b = btn('학습 상태 보기', 'ghost sm', () => safe(async () => {
        b.disabled = true; out.innerHTML = '';
        if (!s.acct) { out.append(h('div', null, '학습 계정이 없는 학생이라 앱 학습 기록이 없습니다.')); return; }
        const q = await db.collection('history').where('branchId', '==', A.bid).where('studentUid', '==', s.id).get();
        const rows = q.docs.map(d => d.data()).filter(r => subjects.includes(histSubj(r))).sort((x, y) => (y.ts || 0) - (x.ts || 0));
        const sc = rows.filter(r => r.score != null);
        out.append(h('div', { style: 'font-weight:700;background:var(--bluebg);color:var(--blue2);border:0' }, '최근 30일 ' + rows.length + '건 · 평균 ' + (sc.length ? Math.round(sc.reduce((a, r) => a + r.score, 0) / sc.length) + '점' : '-')));
        rows.slice(0, 8).forEach(r => out.append(h('div', null, (r.day || dayOf(r.ts)) + ' · ' + (r.title || '') + ' · ' + (r.score != null ? r.score + '점' : (r.status === 'done' ? '완료' : '학습 중')))));
        if (!rows.length) out.append(h('div', null, '이 과목의 최근 학습 기록이 없습니다.'));
      }));
      card.append(b, out);
    }
    g.append(card);
  });
  main.append(g);

}
</script>
<script src="ops.js"></script>
</body>
</html>
