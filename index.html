
<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 학습 플랫폼</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-full bg-slate-900 flex items-center justify-center p-4 m-0">
    <!-- 로그인 화면 -->
    <div id="login-screen" class="w-full max-w-sm bg-white rounded-2xl shadow-2xl p-6">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-slate-800">스마트 학습 플랫폼</h1>
            <p class="text-xs text-slate-400 mt-1">모바일 접속용</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">아이디</label>
                <input type="text" id="login-id" required autocapitalize="off" autocorrect="off" spellcheck="false" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">비밀번호</label>
                <input type="password" id="login-pw" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-md text-sm">로그인</button>
        </form>
        <div id="login-error" class="mt-3 text-center text-xs font-bold text-rose-500 h-4"></div>
    </div>

    <!-- 메인 포털 화면 -->
    <div id="app-portal" class="hidden fixed inset-0 bg-slate-100 flex flex-col p-4">
        <header class="bg-white p-4 rounded-xl shadow-sm mb-4 flex justify-between items-center">
            <h1 class="font-bold text-base text-slate-800">학습 포털 메인</h1>
            <button onclick="logout()" class="text-xs border px-3 py-1.5 rounded-lg font-bold text-slate-600">로그아웃</button>
        </header>
        <main class="bg-white p-5 rounded-xl shadow-sm flex-grow">
            <p class="text-sm font-bold text-slate-700">성공적으로 로그인되었습니다!</p>
        </main>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim().toLowerCase();
            const pw = document.getElementById('login-pw').value.trim();
            const err = document.getElementById('login-error');

            if (['admin', 'onam', 'student1'].includes(id) && (pw === '1234' || pw === '123')) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-portal').classList.remove('hidden');
            } else {
                err.innerText = '아이디 또는 비밀번호가 올바르지 않습니다.';
            }
        }
        function logout() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-portal').classList.add('hidden');
            document.getElementById('login-id').value = '';
            document.getElementById('login-pw').value = '';
        }
    </script>
</body>
</html>
