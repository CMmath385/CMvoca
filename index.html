
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 학습 플랫폼</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">
    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 border border-slate-100">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-800">스마트 학습 플랫폼</h1>
                <p class="text-xs text-slate-400 mt-1">모바일 최적화 버전</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">아이디</label>
                    <input type="text" id="login-id" required autocapitalize="off" autocorrect="off" spellcheck="false" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">비밀번호</label>
                    <input type="password" id="login-pw" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-md">로그인</button>
            </form>
            <div id="login-error" class="mt-4 text-center text-xs font-bold text-rose-500 h-4"></div>
        </div>
    </div>

    <div id="app-portal" class="hidden flex-grow flex flex-col p-4">
        <header class="bg-white p-4 rounded-2xl shadow-sm mb-4 flex justify-between items-center">
            <h1 id="portal-title" class="font-bold text-lg text-slate-800">학습 포털</h1>
            <button onclick="logout()" class="text-xs border px-3 py-1.5 rounded-xl font-bold">로그아웃</button>
        </header>
        <main class="bg-white p-6 rounded-2xl shadow-sm flex-grow">
            <div id="content-area" class="space-y-3">
                <p class="font-bold text-slate-700">환영합니다! 학습 자료가 정상적으로 로드되었습니다.</p>
            </div>
        </main>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim().toLowerCase();
            const pw = document.getElementById('login-pw').value.trim();
            const err = document.getElementById('login-error');

            if ((id === 'admin' && pw === '1234') || (id === 'onam' && pw === '123') || (id === 'student1' && pw === '123')) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-portal').classList.remove('hidden');
            } else {
                err.innerText = '아이디 또는 비밀번호가 올바르지 않습니다.';
            }
        }
        function logout() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-portal').classList.add('hidden');
            document.getElementById('login-id').value = '';
            document.getElementById('login-pw').value = '';
        }
    </script>
</body>
</html>
