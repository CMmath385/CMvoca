<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 플랫폼</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div id="login-box" class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-8">
        <h1 class="text-xl font-bold text-slate-800 text-center mb-6">시스템 로그인</h1>
        <form onsubmit="doLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">아이디</label>
                <input type="text" id="u-id" required class="w-full p-3 bg-slate-50 border rounded-xl font-bold text-slate-800">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">비밀번호</label>
                <input type="password" id="u-pw" required class="w-full p-3 bg-slate-50 border rounded-xl font-bold text-slate-800">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">로그인</button>
        </form>
        <div id="err-msg" class="mt-3 text-center text-xs font-bold text-rose-500"></div>
    </div>

    <div id="main-box" class="hidden fixed inset-0 bg-slate-100 p-6 flex flex-col">
        <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center mb-4">
            <h2 class="font-bold text-slate-800">메인 포털 화면</h2>
            <button onclick="location.reload()" class="text-xs border px-3 py-1.5 rounded-lg font-bold">로그아웃</button>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm flex-grow">
            <p class="font-bold text-slate-700">로그인 성공! 시스템이 정상 작동 중입니다.</p>
        </div>
    </div>

    <script>
        function doLogin(e) {
            e.preventDefault();
            const id = document.getElementById('u-id').value.trim();
            const pw = document.getElementById('u-pw').value.trim();
            if (id === 'admin' && pw === '1234') {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('main-box').classList.remove('hidden');
            } else {
                document.getElementById('err-msg').innerText = '아이디 또는 비밀번호가 올바르지 않습니다. (admin / 1234)';
            }
        }
    </script>
</body>
</html>
