<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최강수학메이드영어학원 - 영어 단어 학습 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg py-5 px-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">최강수학메이드영어학원</h1>
                <p class="text-indigo-200 text-sm mt-0.5">스마트 영어 단어 & 스펠링 학습 시스템</p>
            </div>
            <div id="status-badge" class="hidden md:block bg-indigo-800 text-indigo-100 text-xs px-3 py-1.5 rounded-full border border-indigo-600">
                온라인 학습관 연결됨
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Category Selector -->
        <section class="mb-8">
            <h2 class="text-xl font-bold text-slate-800 mb-4 border-l-4 border-indigo-600 pl-3">학년별 학습 과정 선택</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="filterGrade('all')" class="grade-btn bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:border-indigo-500 font-bold text-slate-700 hover:text-indigo-600 transition text-center active-grade" data-grade="all">
                    전체 보기
                </button>
                <button onclick="filterGrade('m1')" class="grade-btn bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:border-indigo-500 font-bold text-slate-700 hover:text-indigo-600 transition text-center" data-grade="m1">
                    중학교 1학년 (천재 이상기)
                </button>
                <button onclick="filterGrade('m2')" class="grade-btn bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:border-indigo-500 font-bold text-slate-700 hover:text-indigo-600 transition text-center" data-grade="m2">
                    중학교 2학년 (천재 소영순)
                </button>
                <button onclick="filterGrade('m3')" class="grade-btn bg-white opacity-50 p-4 rounded-xl shadow-sm border border-slate-200 font-bold text-slate-400 text-center cursor-not-allowed" disabled>
                    중학교 3학년 (준비중)
                </button>
            </div>
        </section>

        <!-- Lesson Cards Grid -->
        <section id="lesson-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Content Load -->
        </section>

        <!-- Quiz Container (Hidden initially) -->
        <section id="quiz-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-6 relative">
                <button onclick="closeQuiz()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
                
                <div class="flex justify-between items-center mb-4 border-b pb-3">
                    <span id="quiz-title" class="text-indigo-600 font-bold text-lg">Lesson 5 스펠링 학습</span>
                    <span id="quiz-progress" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-semibold">1 / 20</span>
                </div>

                <div class="text-center py-6">
                    <p class="text-sm text-slate-500 mb-2">제시된 우리말 뜻에 맞는 영단어 철자를 소문자로 입력하세요.</p>
                    <h3 id="quiz-meaning" class="text-2xl font-bold text-slate-800 min-h-[3.5rem] flex items-center justify-center">
                        아름다운
                    </h3>
                </div>

                <form onsubmit="checkQuizAnswer(event)" class="space-y-4">
                    <input type="text" id="quiz-input" autocomplete="off" placeholder="소문자 철자 입력..." class="w-full text-center text-xl font-bold p-3.5 border-2 border-slate-200 rounded-xl focus:border-indigo-600 focus:outline-none">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition">
                        확인 (Enter)
                    </button>
                </form>

                <div id="quiz-feedback" class="mt-4 text-center font-bold h-6 text-sm"></div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-400 text-center py-6 text-sm border-t border-slate-700">
        <p>© 2026 최강수학메이드영어학원. All rights reserved.</p>
        <p class="text-xs text-slate-500 mt-1">문의 및 수강 안내: 010-4667-9110 | 경기도 남양주시 오남읍</p>
    </footer>

    <script>
        // 학년별/단원별 Vocabulary Database
        const lessonsData = [
            {
                id: 'm1-5',
                grade: 'm1',
                title: '중1 천재(이상기) - 5과',
                desc: 'Lesson 5 Vocabulary & Word Test (87단어)',
                count: 87,
                words: [
                    { word: "tomorrow", meaning: "내일" }, { word: "weekend", meaning: "주말" },
                    { word: "beautiful", meaning: "아름다운" }, { word: "visit", meaning: "방문하다" },
                    { word: "excited", meaning: "신이 난" }, { word: "dolphin", meaning: "돌고래" },

                    { word: "live", meaning: "살다" }, { word: "trip", meaning: "여행" },
                    { word: "amazing", meaning: "놀라운, 멋진" }, { word: "august", meaning: "8월" },
                    { word: "statue", meaning: "상, 조각상" }, { word: "admiral", meaning: "해군 장성" },
                    { word: "finally", meaning: "마침내" }, { word: "imagine", meaning: "상상하다" },
                    { word: "battle", meaning: "전투, 싸움" }, { word: "arrive", meaning: "도착하다" },
                    { word: "market", meaning: "시장" }, { word: "coast", meaning: "해안, 연안" }
                ]
            },
            {
                id: 'm1-6',
                grade: 'm1',
                title: '중1 천재(이상기) - 6과',
                desc: 'Lesson 6 Vocabulary & Word Test (67단어)',
                count: 67,
                words: [
                    { word: "think", meaning: "생각하다" }, { word: "friendly", meaning: "상냥한, 친근한" },
                    { word: "beautiful", meaning: "아름다운" }, { word: "painting", meaning: "그림" },
                    { word: "design", meaning: "디자인" }, { word: "starry", meaning: "별이 많은" },
                    { word: "peaceful", meaning: "평화로운" }, { word: "unique", meaning: "독특한" },
                    { word: "amazing", meaning: "놀라운" }, { word: "artist", meaning: "화가, 예술가" },
                    { word: "price", meaning: "가격" }, { word: "museum", meaning: "박물관" },
                    { word: "nature", meaning: "자연" }, { word: "cute", meaning: "귀여운" },
                    { word: "expensive", meaning: "비싼" }, { word: "scary", meaning: "무서운" },
                    { word: "poster", meaning: "포스터" }, { word: "exhibition", meaning: "전시회" },
                    { word: "smile", meaning: "미소" }, { word: "shell", meaning: "껍데기, 껍질" }
                ]
            },
            {
                id: 'm1-7',
                grade: 'm1',
                title: '중1 천재(이상기) - 7과',
                desc: 'Lesson 7 Vocabulary & Word Test (64단어)',
                count: 64,
                words: [
                    { word: "carrot", meaning: "당근" }, { word: "vegetable", meaning: "야채, 채소" },
                    { word: "order", meaning: "주문하다" }, { word: "drink", meaning: "마시다" },
                    { word: "barbecue", meaning: "바비큐" }, { word: "salad", meaning: "샐러드" },
                    { word: "spicy", meaning: "매운" }, { word: "curry", meaning: "카레" },
                    { word: "decide", meaning: "결정하다" }, { word: "beef", meaning: "소고기" },
                    { word: "dish", meaning: "요리" }, { word: "shell", meaning: "껍데기" },
                    { word: "delicious", meaning: "아주 맛있는" }, { word: "recipe", meaning: "조리법, 레시피" },
                    { word: "crab", meaning: "게" }, { word: "cheese", meaning: "치즈" },
                    { word: "potato", meaning: "감자" }, { word: "avocado", meaning: "아보카도" },
                    { word: "chicken", meaning: "닭, 닭고기" }, { word: "popular", meaning: "인기 있는" }
                ]
            },
            {
                id: 'm1-8',
                grade: 'm1',
                title: '중1 천재(이상기) - 8과',
                desc: 'Lesson 8 Vocabulary & Word Test (58단어)',
                count: 58,
                words: [
                    { word: "thirsty", meaning: "목이 마른" }, { word: "headache", meaning: "두통" },
                    { word: "glove", meaning: "장갑" }, { word: "present", meaning: "선물" },
                    { word: "scarf", meaning: "목도리" }, { word: "umbrella", meaning: "우산" },
                    { word: "perfect", meaning: "완벽한" }, { word: "check", meaning: "확인하다" },
                    { word: "hedgehog", meaning: "고슴도치" }, { word: "week", meaning: "주, 일주일" },
                    { word: "excited", meaning: "신이 난" }, { word: "inside", meaning: "안으로, 안에" },
                    { word: "birthday", meaning: "생일" }, { word: "playground", meaning: "운동장" },
                    { word: "lonely", meaning: "외로운" }, { word: "alone", meaning: "혼자인, 홀로" },
                    { word: "classroom", meaning: "교실" }, { word: "spine", meaning: "가시" },
                    { word: "sponge", meaning: "스펀지" }, { word: "jacket", meaning: "자켓, 외투" }
                ]
            },
            {
                id: 'm2-7',
                grade: 'm2',
                title: '중2 천재(소영순) - 7과',
                desc: 'Lesson 7 Vocabulary & Word Test (78단어)',
                count: 78,
                words: [
                    { word: "photo", meaning: "사진" }, { word: "hiking", meaning: "하이킹, 도보 여행" },
                    { word: "visitor", meaning: "방문객" }, { word: "sunset", meaning: "일몰" },
                    { word: "trail", meaning: "코스, 산길" }, { word: "collect", meaning: "모으다" },
                    { word: "painting", meaning: "그림" }, { word: "season", meaning: "계절" },
                    { word: "surprise", meaning: "놀라운 일" }, { word: "artist", meaning: "예술가" },
                    { word: "passport", meaning: "여권" }, { word: "talent", meaning: "재능" },
                    { word: "record", meaning: "기록하다" }, { word: "garden", meaning: "정원" },
                    { word: "wild", meaning: "야생의" }, { word: "wonderland", meaning: "아주 멋진 곳" },
                    { word: "preserve", meaning: "보존하다" }, { word: "effort", meaning: "노력" },
                    { word: "species", meaning: "종" }, { word: "beauty", meaning: "아름다움" }
                ]
            }
        ];

        let activeWords = [];
        let quizIndex = 0;

        function renderGrid(filterGradeType = 'all') {
            const grid = document.getElementById('lesson-grid');
            grid.innerHTML = '';

            const filtered = filterGradeType === 'all' 
                ? lessonsData 
                : lessonsData.filter(l => l.grade === filterGradeType);

            filtered.forEach(lesson => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-6 shadow-sm hover:shadow-md transition border border-slate-200 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-lg uppercase">
                                ${lesson.grade === 'm1' ? '중학교 1학년' : '중학교 2학년'}
                            </span>
                            <span class="text-xs text-slate-400">${lesson.count} Words</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-1">${lesson.title}</h3>
                        <p class="text-sm text-slate-500 mb-4">${lesson.desc}</p>
                    </div>
                    <button onclick="startLessonQuiz('${lesson.id}')" class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl transition shadow-sm text-sm">
                        스펠링 학습 시작하기
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function filterGrade(grade) {
            document.querySelectorAll('.grade-btn').forEach(btn => {
                btn.classList.remove('border-indigo-500', 'text-indigo-600');
            });
            event.target.classList.add('border-indigo-500', 'text-indigo-600');
            renderGrid(grade);
        }

        function startLessonQuiz(lessonId) {
            const lesson = lessonsData.find(l => l.id === lessonId);
            if (!lesson) return;

            activeWords = [...lesson.words].sort(() => Math.random() - 0.5);
            quizIndex = 0;

            document.getElementById('quiz-title').innerText = lesson.title;
            document.getElementById('quiz-modal').classList.remove('hidden');
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (quizIndex >= activeWords.length) {
                alert('해당 과의 모든 단어 스펠링 학습을 마쳤습니다!');
                closeQuiz();
                return;
            }

            const current = activeWords[quizIndex];
            document.getElementById('quiz-meaning').innerText = current.meaning;
            document.getElementById('quiz-progress').innerText = `${quizIndex + 1} / ${activeWords.length}`;
            
            const input = document.getElementById('quiz-input');
            input.value = '';
            input.focus();
            document.getElementById('quiz-feedback').innerText = '';
        }

        function checkQuizAnswer(e) {
            e.preventDefault();
            const input = document.getElementById('quiz-input');
            const userAns = input.value.trim().toLowerCase();
            const current = activeWords[quizIndex];
            const feedback = document.getElementById('quiz-feedback');

            if (!userAns) return;

            if (userAns === current.word.toLowerCase()) {
                feedback.innerHTML = '<span class="text-emerald-600">정답입니다! 다음 단어로 이동합니다. 👍</span>';
                setTimeout(() => {
                    quizIndex++;
                    loadQuizQuestion();
                }, 500);
            } else {
                feedback.innerHTML = `<span class="text-rose-500">오답입니다. 정답: <span class="underline">${current.word}</span></span>`;
                input.value = '';
                input.focus();
            }
        }

        function closeQuiz() {
            document.getElementById('quiz-modal').classList.add('hidden');
        }

        // Initialize Page
        renderGrid('all');
    </script>
</body>
</html>
