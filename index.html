<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최강수학메이드영어학원 - 스마트 학습 플랫폼</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 relative border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-700 text-white rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-4 shadow-lg">
                    CM
                </div>
                <h1 class="text-2xl font-bold text-slate-800">최강수학메이드영어학원</h1>
                <p class="text-xs text-slate-400 mt-1">스마트 영어 학습 포털</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">아이디</label>
                    <input type="text" id="login-id" required placeholder="아이디 입력" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">비밀번호</label>
                    <input type="password" id="login-pw" required placeholder="비밀번호 입력" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:outline-none focus:border-indigo-600">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-md transition">
                    로그인
                </button>
            </form>

            <div id="login-error" class="mt-4 text-center text-xs font-bold text-rose-500 h-4"></div>
        </div>
    </div>

    <!-- 2. MAIN APP PORTAL -->
    <div id="app-portal" class="hidden flex-grow flex flex-col">
        <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
            <div class="max-w-[1600px] mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-indigo-700 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-sm">
                        CM
                    </div>
                    <div>
                        <h1 id="header-academy-name" class="font-bold text-slate-800 text-lg leading-tight">최강수학메이드영어학원</h1>
                        <p id="header-academy-sub" class="text-xs text-slate-400">스마트 영어 학습 포털</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-xs text-slate-500 hover:text-slate-800 font-bold border border-slate-200 px-3 py-1.5 rounded-xl transition">
                    로그아웃
                </button>
            </div>
        </header>

        <main class="max-w-[1600px] mx-auto w-full flex-grow p-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center">
                <h2 id="welcome-msg" class="text-2xl font-bold text-slate-800 mb-4">환영합니다!</h2>
                <p class="text-slate-600">로그인이 정상적으로 완료되었습니다.</p>
            </div>
        </main>
    </div>

    <script>
        // 기본 계정 하드코딩 설정 (충돌 원천 차단)
        const ACCOUNTS = {
            super: { id: 'admin', pw: '1234', name: '최고 관리자' },
            branch: { id: 'onam', pw: '123', name: '최강수학메이드영어학원 (오남지점)' },
            student: { id: 'student1', pw: '123', name: '김철수 학생' }
        };

        function handleLogin(e) {
            e.preventDefault();
            const idInput = document.getElementById('login-id').value.trim().toLowerCase();
            const pwInput = document.getElementById('login-pw').value.trim();
            const err = document.getElementById('login-error');
            err.innerText = '';

            if (idInput === ACCOUNTS.super.id && pwInput === ACCOUNTS.super.pw) {
                startPortal('super', ACCOUNTS.super.name);
                return;
            }
            if (idInput === ACCOUNTS.branch.id && pwInput === ACCOUNTS.branch.pw) {
                startPortal('sub', ACCOUNTS.branch.name);
                return;
            }
            if (idInput === ACCOUNTS.student.id && pwInput === ACCOUNTS.student.pw) {
                startPortal('student', ACCOUNTS.student.name);
                return;
            }

            err.innerText = '아이디 또는 비밀번호가 올바르지 않습니다.';
        }

        function startPortal(role, name) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-portal').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = `${name}님, 환영합니다!`;
        }

        function logout() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-portal').classList.add('hidden');
            document.getElementById('login-id').value = '';
            document.getElementById('login-pw').value = '';
        }
    </script>
</body>
</html>
