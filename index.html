<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 종합 학습 플랫폼 - 멀티 아카데미</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        @media (max-width: 767px) {
            #sidebar-container { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
            #sidebar-container button { flex: none; width: auto; white-space: nowrap; }
            #super-admin-tabs, #sub-admin-tabs { overflow-x: auto; }
            #super-admin-tabs button, #sub-admin-tabs button { flex: none !important; white-space: nowrap; }
            #content-container > div { flex-wrap: wrap; }
            main { padding: 14px !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 relative border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-700 text-white rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-4 shadow-lg overflow-hidden">
                    CM
                </div>
                <h1 class="text-2xl font-bold text-slate-800">스마트 학습 플랫폼</h1>
                <p class="text-xs text-slate-400 mt-1">실시간 클라우드 동기화 시스템</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">아이디</label>
                    <input type="text" id="login-id" required placeholder="아이디 입력" autocapitalize="off" autocorrect="off" spellcheck="false" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">비밀번호</label>
                    <input type="password" id="login-pw" required placeholder="비밀번호 입력" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:outline-none focus:border-indigo-600">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-md transition">
                    로그인
                </button>
            </form>

            <div id="login-error" class="mt-4 text-center text-xs font-bold text-rose-500 h-4"></div>
            
            <div class="mt-6 flex justify-between items-center text-xs px-2 border-t border-slate-100 pt-4">
                <button onclick="forceResetStorage()" class="text-slate-400 font-bold underline hover:text-slate-600">저장소 초기화</button>
                <button onclick="exportData()" class="text-indigo-600 font-bold underline hover:text-indigo-800 text-sm">📥 백업 내보내기</button>
            </div>
        </div>
    </div>

    <!-- 2. MAIN APP PORTAL -->
    <div id="app-portal" class="hidden flex-grow flex flex-col">
        <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
            <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="resetToHome()">
                    <div id="header-logo" class="w-10 h-10 bg-indigo-700 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-sm overflow-hidden">
                        CM
                    </div>
                    <div>
                        <h1 id="header-academy-name" class="font-bold text-slate-800 text-lg leading-tight">최강수학메이드영어학원</h1>
                        <p id="header-academy-sub" class="text-xs text-slate-400">스마트 영어 학습 포털</p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <nav id="top-nav-container" class="flex flex-wrap gap-2 text-sm font-bold items-center">
                        <!-- Dynamic Top Tabs -->
                    </nav>
                    <button onclick="manageTopTabsPrompt()" id="btn-manage-tabs" class="hidden text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-2.5 py-2 rounded-xl transition" title="상단 메뉴 관리">⚙️ 메뉴설정</button>
                </div>

                <div class="flex items-center gap-3">
                    <span id="user-badge" class="text-xs bg-indigo-50 text-indigo-700 font-bold px-3 py-1.5 rounded-xl border border-indigo-100">
                        사용자 모드
                    </span>
                    <button onclick="logout()" class="text-xs text-slate-500 hover:text-slate-800 font-bold border border-slate-200 px-3 py-1.5 rounded-xl transition">
                        로그아웃
                    </button>
                </div>
            </div>
        </header>

        <div class="max-w-[1600px] mx-auto w-full flex-grow flex flex-col md:flex-row p-4 gap-4">
            <aside class="w-full md:w-64 flex-shrink-0 flex flex-col gap-2">
                <div class="flex justify-between items-center px-1 mb-1">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">학습 카테고리</span>
                    <div class="flex items-center gap-1">
                        <button onclick="manageSidebarCategoriesPrompt()" id="sidebar-manage-btn" class="hidden text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-bold hover:bg-slate-300">⚙️ 관리</button>
                        <button onclick="addSidebarCategoryPrompt()" id="sidebar-add-btn" class="hidden text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded font-bold hover:bg-indigo-100">+ 추가</button>
                    </div>
                </div>
                <div id="sidebar-container" class="flex flex-col gap-1.5">
                    <!-- Dynamic Sidebar -->
                </div>
            </aside>

            <main class="flex-grow bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                <div>
                    <div id="super-admin-tabs" class="hidden mb-6 bg-slate-100 p-1.5 rounded-xl flex gap-2 border border-slate-200">
                        <button onclick="switchAdminView('content')" id="sup-v-content" class="flex-1 py-2 rounded-lg text-xs font-bold bg-white text-indigo-600 shadow-sm">👑 본원 콘텐츠 마스터</button>
                        <button onclick="switchAdminView('branches')" id="sup-v-branches" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">🏛️ 지점장 관리</button>
                    </div>

                    <div id="sub-admin-tabs" class="hidden mb-6 bg-slate-100 p-1.5 rounded-xl flex gap-2 border border-slate-200">
                        <button onclick="switchSubView('content')" id="sub-v-content" class="flex-1 py-2 rounded-lg text-xs font-bold bg-white text-indigo-600 shadow-sm">📂 학원 학습 자료실</button>
                        <button onclick="switchSubView('students')" id="sub-v-students" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">👨‍🎓 학생 관리</button>
                        <button onclick="switchSubView('history')" id="sub-v-history" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">📊 학습 이력</button>
                        <button onclick="switchSubView('settings')" id="sub-v-settings" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">⚙️ 학원 설정</button>
                    </div>

                    <!-- VIEW 1: CONTENT -->
                    <div id="view-content">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-4 border-b border-slate-100">
                            <div>
                                <div id="breadcrumb" class="text-xs font-bold text-indigo-600 mb-1 flex items-center gap-1">
                                    📁 폴더
                                </div>
                                <h2 id="current-title" class="text-xl font-bold text-slate-800">폴더 및 학습 목록</h2>
                            </div>
                            
                            <div class="flex items-center gap-2 w-full sm:w-auto" id="action-buttons-box">
                                <button onclick="addFolderPrompt()" id="btn-add-folder" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-xl font-bold shadow-sm transition">+ 새 폴더 추가</button>
                                <button onclick="addLinkFilePrompt()" id="btn-add-link" class="bg-sky-600 hover:bg-sky-700 text-white text-xs px-3 py-2 rounded-xl font-bold shadow-sm transition">🔗 웹/링크 등록</button>
                            </div>
                        </div>

                        <div id="tab-info-banner" class="mb-6 p-3 bg-indigo-50 rounded-2xl border border-indigo-100 flex items-center justify-between">
                            <span id="tab-info-text" class="text-xs font-bold text-indigo-900">💡 본원이 공유한 공통 자료는 보호되며, 우리 학원에서 추가한 자료만 자유롭게 수정·삭제할 수 있습니다.</span>
                        </div>

                        <div id="content-container" class="space-y-3"></div>
                    </div>

                    <!-- VIEW 2: BRANCHES -->
                    <div id="view-branches" class="hidden">
                        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                            <div>
                                <span class="text-xs font-bold text-indigo-600">프랜차이즈 관리</span>
                                <h2 class="text-xl font-bold text-slate-800">지점장 계정 등록 및 수정</h2>
                            </div>
                            <button onclick="addBranchPrompt()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2.5 rounded-xl font-bold shadow-sm transition">+ 신규 지점 등록</button>
                        </div>
                        <div id="branch-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    </div>

                    <!-- VIEW 3: STUDENTS -->
                    <div id="view-sub-students" class="hidden">
                        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                            <div>
                                <span class="text-xs font-bold text-indigo-600">원생 관리</span>
                                <h2 class="text-xl font-bold text-slate-800">소속 학생 관리</h2>
                            </div>
                            <button onclick="addSubStudentPrompt()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2.5 rounded-xl font-bold shadow-sm transition">+ 소속 학생 등록</button>
                        </div>
                        <div id="sub-student-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    </div>

                    <!-- VIEW 4: HISTORY -->
                    <div id="view-sub-history" class="hidden">
                        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                            <div>
                                <span class="text-xs font-bold text-indigo-600">학습 리포트</span>
                                <h2 class="text-xl font-bold text-slate-800">학생 테스트 점수 및 학습 이력</h2>
                            </div>
                        </div>
                        <div id="sub-history-container" class="space-y-3"></div>
                    </div>

                    <!-- VIEW 5: SETTINGS -->
                    <div id="view-sub-settings" class="hidden">
                        <div class="mb-6 pb-4 border-b border-slate-100">
                            <span class="text-xs font-bold text-indigo-600">학원 설정</span>
                            <h2 class="text-xl font-bold text-slate-800">학원명 및 로고 변경</h2>
                        </div>
                        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 max-w-xl space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">학원명</label>
                                <input type="text" id="setting-academy-name" class="w-full p-3 bg-white border border-slate-300 rounded-xl font-bold text-slate-800">
                            </div>
                            <button onclick="saveAcademySettings()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition">
                                설정 저장하기
                            </button>
                        </div>
                    </div>
                </div>

                <footer class="mt-8 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
                    © 2026 스마트 종합 학습 플랫폼. All rights reserved.
                </footer>
            </main>
        </div>
    </div>

    <!-- Video Modal -->
    <div id="video-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full p-6 relative">
            <button onclick="closeVideo()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            <h3 id="video-title" class="text-lg font-bold text-slate-800 mb-4">영상 학습</h3>
            <div class="aspect-video w-full rounded-xl overflow-hidden bg-black">
                <iframe id="video-iframe" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const initialMasterDatabase = {
            'middle_exam': [
                { id: 'f_onam_high', type: 'folder', name: '오남고 공통영어2', parentId: null, tabId: 'video', authorRole: 'super' },
                { id: 'f_onam_l3', type: 'folder', name: 'Lesson 3', parentId: 'f_onam_high', tabId: 'video', authorRole: 'super' },
                { id: 'f_onam_l4', type: 'folder', name: 'Lesson 4', parentId: 'f_onam_high', tabId: 'video', authorRole: 'super' }
            ],
            'high_exam': [],
            'grammar': []
        };

        let state = {
            currentUser: null,
            superAdminPw: '1234',
            branches: [
                { id: 'branch_1', username: 'onam', password: '123', academyName: '최강수학메이드영어학원', logoImage: '' }
            ],
            students: [
                { id: 's1', branchId: 'branch_1', username: 'student1', password: '123', name: '김철수', grade: '고1' }
            ],
            historyRecords: [],
            topTabs: [
                { id: 'video', name: '영상학습훈련' },
                { id: 'voca', name: '단어' },
                { id: 'passage', name: '본문' }
            ],
            sidebarCats: [
                { id: 'middle_exam', name: '내신문제' },
                { id: 'high_exam', name: '고등부 심화' },
                { id: 'grammar', name: '문법' }
            ],
            masterDatabase: JSON.parse(JSON.stringify(initialMasterDatabase)),
            currentSuperView: 'content',
            currentSubView: 'content',
            currentTopTab: 'video',
            currentSidebarCat: 'middle_exam',
            currentFolderId: null
        };

        function forceResetStorage() {
            localStorage.clear();
            localStorage.removeItem('cm_admin_pc');
            alert('초기화되었습니다.');
            location.reload();
        }

        async function loadShared() {
            loadState();
            try {
                const r = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' });
                if (r.ok) {
                    const d = await r.json();
                    ['branches','students','masterDatabase','topTabs','sidebarCats'].forEach(k => { if (d[k]) state[k] = d[k]; });
                }
            } catch (e) {}
        }

        function exportData() {
            const data = { branches: state.branches, students: state.students, masterDatabase: state.masterDatabase, topTabs: state.topTabs, sidebarCats: state.sidebarCats };
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
            a.download = 'data.json';
            a.click();
        }

        function loadState() {
            const saved = localStorage.getItem('multi_academy_portal_v25');
            if (saved) {
                try {
                    const p = JSON.parse(saved);
                    state.branches = p.branches && p.branches.length > 0 ? p.branches : state.branches;
                    state.students = p.students && p.students.length > 0 ? p.students : state.students;
                    state.historyRecords = p.historyRecords || [];
                    state.masterDatabase = p.masterDatabase && Object.keys(p.masterDatabase).length > 0 ? p.masterDatabase : JSON.parse(JSON.stringify(initialMasterDatabase));
                    state.topTabs = p.topTabs && p.topTabs.length > 0 ? p.topTabs : state.topTabs;
                    state.sidebarCats = p.sidebarCats && p.sidebarCats.length > 0 ? p.sidebarCats : state.sidebarCats;
                } catch(e){
                    state.masterDatabase = JSON.parse(JSON.stringify(initialMasterDatabase));
                }
            } else {
                state.masterDatabase = JSON.parse(JSON.stringify(initialMasterDatabase));
            }
        }

        function saveState() {
            localStorage.setItem('multi_academy_portal_v25', JSON.stringify({
                branches: state.branches,
                students: state.students,
                historyRecords: state.historyRecords,
                masterDatabase: state.masterDatabase,
                topTabs: state.topTabs,
                sidebarCats: state.sidebarCats
            }));
        }

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim().toLowerCase();
            const pw = document.getElementById('login-pw').value.trim();
            const err = document.getElementById('login-error');

            if (id === 'admin' && pw === state.superAdminPw) {
                state.currentUser = { role: 'super', username: 'admin' };
                localStorage.setItem('cm_admin_pc', '1');
                enterPortal();
                return;
            }

            const branch = state.branches.find(b => b.username.toLowerCase() === id && b.password === pw);
            if (branch) {
                state.currentUser = { role: 'sub', branchId: branch.id, academyName: branch.academyName, logoImage: branch.logoImage };
                enterPortal();
                return;
            }

            const student = state.students.find(s => s.username.toLowerCase() === id && s.password === pw);
            if (student) {
                const b = state.branches.find(x => x.id === student.branchId);
                state.currentUser = { role: 'student', branchId: student.branchId, name: student.name, academyName: b ? b.academyName : '학원' };
                enterPortal();
                return;
            }

            err.innerText = '아이디 또는 비밀번호가 올바르지 않습니다.';
        }

        function enterPortal() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-portal').classList.remove('hidden');

            const badge = document.getElementById('user-badge');
            const nameEl = document.getElementById('header-academy-name');
            const subEl = document.getElementById('header-academy-sub');

            if (state.currentUser.role === 'super') {
                badge.innerText = '👑 최고 관리자 (본원)';
                nameEl.innerText = '학습 플랫폼 본원 관리센터';
                subEl.innerText = '전체 시스템 및 지점 관리';
                document.getElementById('super-admin-tabs').classList.remove('hidden');
                document.getElementById('sub-admin-tabs').classList.add('hidden');
                document.getElementById('sidebar-add-btn').classList.remove('hidden');
                document.getElementById('sidebar-manage-btn').classList.remove('hidden');
                document.getElementById('btn-manage-tabs').classList.remove('hidden');
            } else if (state.currentUser.role === 'sub') {
                badge.innerText = `🏛️ ${state.currentUser.academyName} 원장님`;
                nameEl.innerText = state.currentUser.academyName;
                subEl.innerText = '지점 관리자 모드 (자체 자료 등록/수정 가능)';
                document.getElementById('super-admin-tabs').classList.add('hidden');
                document.getElementById('sub-admin-tabs').classList.remove('hidden');
                document.getElementById('sidebar-add-btn').classList.add('hidden');
                document.getElementById('sidebar-manage-btn').classList.add('hidden'); // 지점장은 카테고리 구조 수정 불가
                document.getElementById('btn-manage-tabs').classList.add('hidden');
            } else {
                const b = state.branches.find(x => x.id === student.branchId);
                badge.innerText = `👨‍🎓 ${state.currentUser.name} 학생`;
                nameEl.innerText = b ? b.academyName : '학원';
                subEl.innerText = '학생 학습관';
                document.getElementById('super-admin-tabs').classList.add('hidden');
                document.getElementById('sub-admin-tabs').classList.add('hidden');
                document.getElementById('sidebar-add-btn').classList.add('hidden');
                document.getElementById('sidebar-manage-btn').classList.add('hidden');
                document.getElementById('btn-manage-tabs').classList.add('hidden');
            }

            if (!state.topTabs.some(t => t.id === state.currentTopTab) && state.topTabs.length > 0) {
                state.currentTopTab = state.topTabs[0].id;
            }

            renderTopNav();
            renderSidebar();
            renderContent();
        }

        function logout() {
            state.currentUser = null;
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-portal').classList.add('hidden');
            document.getElementById('login-id').value = '';
            document.getElementById('login-pw').value = '';
        }

        function renderTopNav() {
            const container = document.getElementById('top-nav-container');
            container.innerHTML = '';

            state.topTabs.forEach(tab => {
                const isActive = state.currentTopTab === tab.id;
                const btn = document.createElement('button');
                btn.className = isActive
                    ? 'bg-amber-500 text-slate-900 font-bold px-4 py-2 rounded-xl shadow-sm transition'
                    : 'bg-slate-100 text-slate-700 font-bold px-4 py-2 rounded-xl hover:bg-slate-200 transition';
                btn.innerText = tab.name;
                btn.onclick = () => {
                    state.currentTopTab = tab.id;
                    renderTopNav();
                    renderContent();
                };
                container.appendChild(btn);
            });
        }

        function manageTopTabsPrompt() {
            if (state.currentUser.role !== 'super') return alert('최고관리자만 메뉴를 설정할 수 있습니다.');
            const action = prompt('상단 메뉴(탭) 관리 옵션을 선택하세요:\n1. 추가\n2. 이름 수정\n3. 삭제\n4. 순서 변경', '1');
            if (!action) return;

            if (action === '1') {
                const name = prompt('새 메뉴 이름을 입력하세요:');
                if (!name) return;
                const id = 'tab_' + Date.now();
                state.topTabs.push({ id, name: name.trim() });
            } else if (action === '2' || action === '3' || action === '4') {
                const listStr = state.topTabs.map((t, idx) => `${idx + 1}. ${t.name}`).join('\n');
                const idxChoice = prompt(`대상 메뉴 번호를 입력하세요:\n\n${listStr}`);
                if (!idxChoice) return;
                const idx = parseInt(idxChoice) - 1;
                if (isNaN(idx) || idx < 0 || idx >= state.topTabs.length) return alert('올바른 번호가 아닙니다.');

                if (action === '2') {
                    const newName = prompt('새 메뉴 이름을 입력하세요:', state.topTabs[idx].name);
                    if (newName) state.topTabs[idx].name = newName.trim();
                } else if (action === '3') {
                    if (state.topTabs.length <= 1) return alert('최소 1개의 메뉴는 남아있어야 합니다.');
                    const removedId = state.topTabs[idx].id;
                    state.topTabs.splice(idx, 1);
                    if (state.currentTopTab === removedId) state.currentTopTab = state.topTabs[0].id;
                } else if (action === '4') {
                    if (idx > 0) {
                        const temp = state.topTabs[idx];
                        state.topTabs[idx] = state.topTabs[idx - 1];
                        state.topTabs[idx - 1] = temp;
                    }
                }
            }
            renderTopNav();
            renderContent();
            saveState();
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-container');
            container.innerHTML = '';

            state.sidebarCats.forEach(cat => {
                const isActive = state.currentSidebarCat === cat.id;
                const btn = document.createElement('button');
                btn.className = isActive
                    ? 'w-full text-left bg-indigo-900 text-white font-bold p-3 rounded-xl shadow-sm text-sm flex justify-between items-center'
                    : 'w-full text-left bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold p-3 rounded-xl text-sm flex justify-between items-center border border-slate-200 transition';
                btn.innerHTML = `<span>${cat.name}</span> ${isActive ? '<span class="text-[10px] bg-indigo-600 px-2 py-0.5 rounded-full text-white">선택됨</span>' : ''}`;
                btn.onclick = () => {
                    state.currentSidebarCat = cat.id;
                    state.currentFolderId = null;
                    renderContent();
                };
                container.appendChild(btn);
            });
        }

        function manageSidebarCategoriesPrompt() {
            if (state.currentUser.role !== 'super') return;
            const action = prompt('카테고리 관리 옵션:\n1. 이름 수정\n2. 삭제\n3. 순서 변경', '1');
            if (!action) return;

            const listStr = state.sidebarCats.map((c, idx) => `${idx + 1}. ${c.name}`).join('\n');
            const idxChoice = prompt(`대상 카테고리 번호:\n\n${listStr}`);
            if (!idxChoice) return;
            const idx = parseInt(idxChoice) - 1;
            if (isNaN(idx) || idx < 0 || idx >= state.sidebarCats.length) return;

            if (action === '1') {
                const newName = prompt('새 카테고리 이름:', state.sidebarCats[idx].name);
                if (newName) state.sidebarCats[idx].name = newName.trim();
            } else if (action === '2') {
                if (state.sidebarCats.length <= 1) return alert('최소 1개 유지');
                const catId = state.sidebarCats[idx].id;
                state.sidebarCats.splice(idx, 1);
                delete state.masterDatabase[catId];
                if (state.currentSidebarCat === catId) state.currentSidebarCat = state.sidebarCats[0].id;
            } else if (action === '3' && idx > 0) {
                const temp = state.sidebarCats[idx];
                state.sidebarCats[idx] = state.sidebarCats[idx - 1];
                state.sidebarCats[idx - 1] = temp;
            }
            renderSidebar();
            renderContent();
            saveState();
        }

        function getBreadcrumbPath(folderId) {
            const path = [];
            let currId = folderId;
            const items = state.masterDatabase[state.currentSidebarCat] || [];

            while (currId) {
                const found = items.find(i => i.id === currId);
                if (found) {
                    path.unshift(found);
                    currId = found.parentId;
                } else break;
            }
            return path;
        }

        function renderContent() {
            const container = document.getElementById('content-container');
            const breadcrumb = document.getElementById('breadcrumb');
            const title = document.getElementById('current-title');
            container.innerHTML = '';

            const currentCatObj = state.sidebarCats.find(c => c.id === state.currentSidebarCat);
            const catName = currentCatObj ? currentCatObj.name : '자료실';

            const path = getBreadcrumbPath(state.currentFolderId);
            let trailHtml = `<span class="cursor-pointer text-indigo-600 font-bold hover:underline" onclick="state.currentFolderId=null; renderContent();">📁 ${catName}</span>`;
            path.forEach((p) => {
                trailHtml += ` <span class="text-slate-400">＞</span> <span class="cursor-pointer text-indigo-600 font-bold hover:underline" onclick="state.currentFolderId='${p.id}'; renderContent();">${p.name}</span>`;
            });
            breadcrumb.innerHTML = trailHtml;

            let items = state.masterDatabase[state.currentSidebarCat] || [];
            let currentChildren = items.filter(item => {
                const matchesParent = item.parentId === state.currentFolderId;
                if (!matchesParent) return false;
                if (item.type === 'folder') return true;
                return (item.tabId || 'video') === state.currentTopTab;
            });

            title.innerText = state.currentFolderId ? (path[path.length - 1]?.name || '폴더') : catName;

            if (state.currentFolderId) {
                const parentFolder = path[path.length - 2];
                const backBtn = document.createElement('div');
                backBtn.className = "p-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl cursor-pointer text-sm flex items-center gap-2 border border-slate-200 transition mb-2";
                backBtn.innerHTML = `<span>⬆️ 상위 폴더로 이동</span>`;
                backBtn.onclick = () => { state.currentFolderId = parentFolder ? parentFolder.id : null; renderContent(); };
                container.appendChild(backBtn);
            }

            if (currentChildren.length === 0) {
                container.innerHTML += `<div class="text-center py-12 text-slate-400 font-medium text-sm">등록된 학습 자료가 없습니다.</div>`;
                return;
            }

            currentChildren.forEach((item) => {
                const row = document.createElement('div');
                row.className = "p-4 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center gap-3 font-bold text-slate-700 text-sm hover:border-slate-300 transition";
                
                const leftDiv = document.createElement('div');
                leftDiv.className = "flex items-center gap-2.5 cursor-pointer flex-grow";

                const isSuperItem = (item.authorRole === 'super');
                const badgeHtml = isSuperItem ? `<span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded font-bold">공유됨</span>` : `<span class="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-bold">우리학원</span>`;

                if (item.type === 'folder') {
                    leftDiv.innerHTML = `<span class="text-xl">📂</span> <span class="text-base">${item.name}</span> ${badgeHtml}`;
                    leftDiv.onclick = () => { state.currentFolderId = item.id; renderContent(); };
                } else {
                    const isYt = /youtube\.com|youtu\.be/.test(item.linkUrl);
                    if (isYt) {
                        leftDiv.innerHTML = `<span class="text-xl">🔗</span> <span class="text-base">${item.name}</span> ${badgeHtml}`;
                        leftDiv.onclick = () => openLinkOrVideo(item);
                    } else {
                        leftDiv.innerHTML = `<a href="${item.linkUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 w-full"><span class="text-xl">🔗</span><span class="text-base">${item.name}</span> ${badgeHtml}</a>`;
                    }
                }

                row.appendChild(leftDiv);

                const rightBox = document.createElement('div');
                rightBox.className = 'flex items-center gap-1.5 flex-shrink-0';

                const isSuperUser = (state.currentUser && state.currentUser.role === 'super');
                const isSubUser = (state.currentUser && state.currentUser.role === 'sub');

                // 수정/삭제 권한 판별: 최고관리자는 전체 가능, 하위관리자는 자신이 만든 자료만 가능 (공유 자료 수정/삭제 불가)
                const canModifyThisItem = isSuperUser || (isSubUser && !isSuperItem);

                if (canModifyThisItem && state.currentUser && state.currentUser.role !== 'student') {
                    const upBtn = document.createElement('button');
                    upBtn.className = "bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-2 py-1 rounded font-bold transition";
                    upBtn.innerText = "▲";
                    upBtn.onclick = (e) => { e.stopPropagation(); moveItemOrder(item.id, -1); };
                    rightBox.appendChild(upBtn);

                    const downBtn = document.createElement('button');
                    downBtn.className = "bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-2 py-1 rounded font-bold transition";
                    downBtn.innerText = "▼";
                    downBtn.onclick = (e) => { e.stopPropagation(); moveItemOrder(item.id, 1); };
                    rightBox.appendChild(downBtn);

                    if (item.type === 'file') {
                        const moveTabBtn = document.createElement('button');
                        moveTabBtn.className = "text-amber-600 hover:bg-amber-50 font-bold text-xs px-2 py-1.5 rounded-lg border border-amber-200 transition";
                        moveTabBtn.innerText = "🔀 탭이동";
                        moveTabBtn.onclick = (e) => { e.stopPropagation(); moveItemTabPrompt(item.id); };
                        rightBox.appendChild(moveTabBtn);
                    }

                    const editBtn = document.createElement('button');
                    editBtn.className = "text-indigo-600 hover:bg-indigo-50 font-bold text-xs px-2 py-1.5 rounded-lg border border-indigo-200 transition";
                    editBtn.innerText = "✏️ 수정";
                    editBtn.onclick = (e) => { e.stopPropagation(); editMasterItem(item.id); };
                    rightBox.appendChild(editBtn);

                    const delBtn = document.createElement('button');
                    delBtn.className = "text-rose-500 hover:bg-rose-50 font-bold text-xs px-2 py-1.5 rounded-lg border border-rose-200 transition";
                    delBtn.innerText = "🗑️ 삭제";
                    delBtn.onclick = (e) => { e.stopPropagation(); deleteMasterItem(item.id); };
                    rightBox.appendChild(delBtn);
                }

                const isOpenLink = item.type !== 'folder' && item.linkUrl && !/youtube\.com|youtu\.be/.test(item.linkUrl);
                const actionBtn = document.createElement(isOpenLink ? 'a' : 'button');
                if (isOpenLink) {
                    actionBtn.href = item.linkUrl;
                    actionBtn.target = '_blank';
                    actionBtn.rel = 'noopener noreferrer';
                }
                actionBtn.className = "bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2 rounded-xl font-bold shadow-sm ml-2 transition inline-flex items-center justify-center";
                actionBtn.innerText = item.type === 'folder' ? '열기 ➔' : '학습하기 ➔';
                
                if (!isOpenLink) {
                    actionBtn.onclick = () => {
                        if (item.type === 'folder') {
                            state.currentFolderId = item.id;
                            renderContent();
                        } else {
                            openLinkOrVideo(item);
                        }
                    };
                }
                rightBox.appendChild(actionBtn);

                row.appendChild(rightBox);
                container.appendChild(row);
            });
        }

        function openLinkOrVideo(item) {
            const url = item.linkUrl;
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let embedUrl = url;
                if (url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
                else if (url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
                document.getElementById('video-title').innerText = item.name;
                document.getElementById('video-iframe').src = embedUrl;
                document.getElementById('video-modal').classList.remove('hidden');
            } else {
                window.open(url, '_blank');
            }
        }

        function closeVideo() {
            document.getElementById('video-modal').classList.add('hidden');
            document.getElementById('video-iframe').src = '';
        }

        function moveItemOrder(itemId, dir) {
            const arr = state.masterDatabase[state.currentSidebarCat];
            const idx = arr.findIndex(i => i.id === itemId);
            if (idx === -1) return;
            const targetIdx = idx + dir;
            if (targetIdx < 0 || targetIdx >= arr.length) return;
            const temp = arr[idx];
            arr[idx] = arr[targetIdx];
            arr[targetIdx] = temp;
            renderContent();
            saveState();
        }

        function moveItemTabPrompt(itemId) {
            const item = state.masterDatabase[state.currentSidebarCat].find(i => i.id === itemId);
            if (!item) return;
            if (state.currentUser.role === 'sub' && item.authorRole === 'super') {
                return alert('본원에서 공유해 준 자료는 탭을 이동할 수 없습니다.');
            }

            const tabListStr = state.topTabs.map((t, idx) => `${idx + 1}. ${t.name}`).join('\n');
            const choice = prompt(`이동할 상단 메뉴(탭) 번호:\n\n${tabListStr}`);
            if (!choice) return;
            const idx = parseInt(choice) - 1;
            if (isNaN(idx) || idx < 0 || idx >= state.topTabs.length) return;

            item.tabId = state.topTabs[idx].id;
            renderContent();
            saveState();
            alert(`[${state.topTabs[idx].name}] 탭으로 이동되었습니다.`);
        }

        function editMasterItem(itemId) {
            const item = state.masterDatabase[state.currentSidebarCat].find(i => i.id === itemId);
            if (!item) return;
            if (state.currentUser.role === 'sub' && item.authorRole === 'super') {
                return alert('본원에서 공유해 준 자료는 수정할 수 없습니다.');
            }
            const newName = prompt('새 이름을 입력하세요:', item.name);
            if (!newName) return;
            item.name = newName.trim();
            if (item.linkUrl !== undefined) {
                const newLink = prompt('웹/링크 주소를 입력하세요:', item.linkUrl);
                if (newLink !== null) item.linkUrl = newLink.trim();
            }
            renderContent();
            saveState();
        }

        function deleteMasterItem(id) {
            const item = state.masterDatabase[state.currentSidebarCat].find(i => i.id === id);
            if (item && state.currentUser.role === 'sub' && item.authorRole === 'super') {
                return alert('본원에서 공유해 준 자료는 삭제할 수 없습니다.');
            }
            if (confirm('해당 폴더/자료를 삭제하시겠습니까?')) {
                state.masterDatabase[state.currentSidebarCat] = state.masterDatabase[state.currentSidebarCat].filter(i => i.id !== id && i.parentId !== id);
                renderContent();
                saveState();
            }
        }

        function addFolderPrompt() {
            const name = prompt('새 폴더 이름을 입력하세요 (예: Lesson 5):');
            if (name) {
                if (!state.masterDatabase[state.currentSidebarCat]) state.masterDatabase[state.currentSidebarCat] = [];
                const role = (state.currentUser && state.currentUser.role === 'super') ? 'super' : 'sub';
                state.masterDatabase[state.currentSidebarCat].push({
                    id: 'f_' + Date.now(),
                    type: 'folder',
                    name: name.trim(),
                    parentId: state.currentFolderId,
                    tabId: state.currentTopTab,
                    authorRole: role
                });
                renderContent();
                saveState();
            }
        }

        function addLinkFilePrompt() {
            const title = prompt('학습 자료 제목을 입력하세요:');
            if (!title) return;
            const url = prompt('웹페이지 주소 또는 유튜브 링크 URL을 입력하세요:');
            if (!url) return;

            const fileId = 'link_' + Date.now();
            if (!state.masterDatabase[state.currentSidebarCat]) state.masterDatabase[state.currentSidebarCat] = [];

            const role = (state.currentUser && state.currentUser.role === 'super') ? 'super' : 'sub';
            state.masterDatabase[state.currentSidebarCat].push({
                id: fileId,
                type: 'file',
                name: title.trim(),
                parentId: state.currentFolderId,
                linkUrl: url.trim(),
                tabId: state.currentTopTab,
                authorRole: role
            });

            renderContent();
            saveState();
            alert(`'${title}' 자료가 등록되었습니다.`);
        }

        function addSidebarCategoryPrompt() {
            if (state.currentUser.role !== 'super') return;
            const name = prompt('새 카테고리 이름을 입력하세요:');
            if (name) {
                const id = 'cat_' + Date.now();
                state.sidebarCats.push({ id, name: name.trim() });
                state.masterDatabase[id] = [];
                renderSidebar();
                renderContent();
                saveState();
            }
        }

        function switchAdminView(view) {
            state.currentSuperView = view;
            document.getElementById('view-content').classList.toggle('hidden', view !== 'content');
            document.getElementById('view-branches').classList.toggle('hidden', view !== 'branches');
            if (view === 'content') renderContent();
            else if (view === 'branches') renderBranches();
        }

        function switchSubView(view) {
            state.currentSubView = view;
            document.getElementById('view-content').classList.toggle('hidden', view !== 'content');
            document.getElementById('view-sub-students').classList.toggle('hidden', view !== 'students');
            document.getElementById('view-sub-history').classList.toggle('hidden', view !== 'history');
            document.getElementById('view-sub-settings').classList.toggle('hidden', view !== 'settings');

            if (view === 'content') renderContent();
            else if (view === 'students') renderSubStudents();
            else if (view === 'history') renderSubHistory();
            else if (view === 'settings') {
                if (state.currentUser) document.getElementById('setting-academy-name').value = state.currentUser.academyName || '';
            }
        }

        function renderBranches() {
            const container = document.getElementById('branch-list-container');
            container.innerHTML = '';
            state.branches.forEach(b => {
                const card = document.createElement('div');
                card.className = "p-5 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col justify-between gap-3 shadow-sm";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-slate-800 text-lg">${b.academyName}</span>
                        </div>
                        <div class="text-xs text-slate-600 space-y-1 bg-white p-3 rounded-xl border border-slate-200">
                            <div>🆔 아이디: <strong class="text-indigo-600">${b.username}</strong></div>
                            <div>🔑 비밀번호: <strong class="text-slate-800">${b.password}</strong></div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderSubStudents() {
            const container = document.getElementById('sub-student-list');
            container.innerHTML = '';
            const myStudents = state.students.filter(s => s.branchId === (state.currentUser ? state.currentUser.branchId : ''));
            if (myStudents.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium text-sm">등록된 학생이 없습니다.</div>`;
                return;
            }
            myStudents.forEach(s => {
                const card = document.createElement('div');
                card.className = "p-5 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col justify-between gap-3 shadow-sm";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-slate-800 text-lg">${s.name}</span>
                            <span class="text-xs bg-slate-100 text-indigo-600 px-2.5 py-1 rounded-full font-bold border border-slate-200">${s.grade}</span>
                        </div>
                        <div class="text-xs text-slate-600 space-y-1 bg-white p-3 rounded-xl border border-slate-200">
                            <div>🆔 아이디: <strong class="text-indigo-600">${s.username}</strong></div>
                            <div>🔑 비밀번호: <strong class="text-slate-800">${s.password}</strong></div>
                        </div>
                    </div>
                    <button onclick="removeStudent('${s.id}')" class="text-rose-500 hover:bg-rose-50 text-xs py-2 rounded-xl font-bold border border-rose-200 transition">학생 삭제</button>
                `;
                container.appendChild(card);
            });
        }

        function addSubStudentPrompt() {
            const name = prompt('학생 이름:');
            if (!name) return;
            const username = prompt('학생 아이디:');
            if (!username) return;
            const password = prompt('학생 비밀번호:');
            if (!password) return;
            const grade = prompt('학년 (예: 고1):', '고1');

            state.students.push({ id: 's_' + Date.now(), branchId: state.currentUser.branchId, username: username.trim(), password: password.trim(), name: name.trim(), grade: grade ? grade.trim() : '고1' });
            renderSubStudents();
            saveState();
        }

        function removeStudent(id) {
            if (confirm('삭제하시겠습니까?')) {
                state.students = state.students.filter(s => s.id !== id);
                renderSubStudents();
                saveState();
            }
        }

        function renderSubHistory() {
            const container = document.getElementById('sub-history-container');
            container.innerHTML = '';
            const myRecords = state.historyRecords.filter(h => h.branchId === (state.currentUser ? state.currentUser.branchId : ''));
            if (myRecords.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 font-medium text-sm">학습 이력이 없습니다.</div>`;
                return;
            }
            myRecords.slice().reverse().forEach(h => {
                const row = document.createElement('div');
                row.className = "p-4 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center";
                row.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-slate-800 text-base">${h.studentName}</span>
                            <span class="text-xs bg-slate-100 text-indigo-600 px-2 py-0.5 rounded-full font-bold border border-slate-200">${h.score}점</span>
                        </div>
                        <div class="text-sm text-slate-600 font-medium">${h.title} (${h.correct} / ${h.total} 정답)</div>
                        <div class="text-xs text-slate-400 mt-1">완료 일시: ${h.date}</div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function saveAcademySettings() {
            const name = document.getElementById('setting-academy-name').value.trim();
            if (!name) return alert('학원명을 입력하세요.');
            const branch = state.branches.find(b => b.id === (state.currentUser ? state.currentUser.branchId : ''));
            if (!branch) return;

            branch.academyName = name;
            state.currentUser.academyName = name;
            document.getElementById('header-academy-name').innerText = name;
            saveState();
            alert('학원 설정이 저장되었습니다!');
        }

        function resetToHome() {
            state.currentFolderId = null;
            renderContent();
        }

        loadShared();
    </script>
</body>
</html>
