<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최강수학메이드영어학원 - 종합 학습 포털</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <!-- Top Header & Nav -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
        <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <!-- Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetToHome()">
                <div class="w-10 h-10 bg-indigo-700 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-sm">
                    CM
                </div>
                <div>
                    <h1 class="font-bold text-slate-800 text-lg leading-tight">최강수학메이드영어학원</h1>
                    <p class="text-xs text-slate-400">010-4667-9110 | 스마트 영어 학습 포털</p>
                </div>
            </div>

            <!-- Top Nav Tabs -->
            <nav id="top-nav-container" class="flex flex-wrap gap-2 text-sm font-bold">
                <!-- Dynamically Rendered -->
            </nav>

            <!-- Admin Toggle Button -->
            <div class="flex items-center gap-2">
                <button onclick="toggleAdminMode()" id="admin-btn" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-bold">
                    ⚙️ <span>관리자 모드 (Off)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="max-w-[1600px] mx-auto w-full flex-grow flex flex-col md:flex-row p-4 gap-4">

        <!-- Left Sidebar Categories -->
        <aside class="w-full md:w-64 flex-shrink-0 flex flex-col gap-2">
            <div class="flex justify-between items-center px-1 mb-1">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">학습 카테고리</span>
                <button onclick="addSidebarCategoryPrompt()" class="admin-only hidden text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded font-bold hover:bg-indigo-100">+ 추가</button>
            </div>
            <div id="sidebar-container" class="flex flex-col gap-1.5">
                <!-- Dynamically Rendered -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-grow bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
            
            <div>
                <!-- Admin Top Menu Tabs (Admin Mode Only) -->
                <div id="admin-tab-bar" class="admin-only hidden mb-6 bg-slate-100 p-1.5 rounded-xl flex gap-2 border border-slate-200">
                    <button onclick="switchAdminView('content')" id="admin-view-content-btn" class="flex-1 py-2 rounded-lg text-xs font-bold bg-white text-indigo-600 shadow-sm">📂 콘텐츠/자료 관리</button>
                    <button onclick="switchAdminView('students')" id="admin-view-students-btn" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">👨‍🎓 학생 등록/삭제</button>
                    <button onclick="switchAdminView('history')" id="admin-view-history-btn" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">📊 학생 학습 이력 & 점수</button>
                </div>

                <!-- View 1: Standard Content Manager -->
                <div id="view-content">
                    <!-- Breadcrumb & Header -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-4 border-b border-slate-100">
                        <div>
                            <div id="breadcrumb" class="text-xs font-bold text-indigo-600 mb-1">중등부 내신문제</div>
                            <h2 id="current-title" class="text-xl font-bold text-slate-800">세부 학습 폴더 목록</h2>
                        </div>
                        
                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <button onclick="addFolderPrompt()" class="admin-only hidden bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-xl font-bold shadow-sm transition">+ 새 폴더 추가</button>
                            <button onclick="addFilePrompt()" class="admin-only hidden bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-xl font-bold shadow-sm transition">+ 파일/자료 추가</button>
                        </div>
                    </div>

                    <!-- Folder & File Content Grid/List -->
                    <div id="content-container" class="space-y-3">
                        <!-- Dynamically Rendered -->
                    </div>
                </div>

                <!-- View 2: Student Management View -->
                <div id="view-students" class="hidden">
                    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                        <div>
                            <span class="text-xs font-bold text-indigo-600">학생 관리</span>
                            <h2 class="text-xl font-bold text-slate-800">원생 등록 및 삭제</h2>
                        </div>
                        <button onclick="addStudentPrompt()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2.5 rounded-xl font-bold shadow-sm transition">+ 신규 학생 등록</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="student-list-container">
                        <!-- Student Cards -->
                    </div>
                </div>

                <!-- View 3: Student History & Scores -->
                <div id="view-history" class="hidden">
                    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                        <div>
                            <span class="text-xs font-bold text-indigo-600">학습 이력</span>
                            <h2 class="text-xl font-bold text-slate-800">학생별 학습 기록 및 테스트 점수</h2>
                        </div>
                        <button onclick="clearHistoryConfirm()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs px-3 py-2 rounded-xl font-bold transition">이력 전체 초기화</button>
                    </div>

                    <div id="history-container" class="space-y-3">
                        <!-- History Rows -->
                    </div>
                </div>

            </div>

            <!-- Footer Note -->
            <footer class="mt-8 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
                © 2026 최강수학메이드영어학원. All rights reserved. | 경기도 남양주시 오남읍
            </footer>

        </main>
    </div>

    <!-- Interactive Quiz Modal -->
    <div id="quiz-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-6 relative">
            <button onclick="closeQuiz()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            
            <div id="quiz-body">
                <div class="flex justify-between items-center mb-4 border-b pb-3">
                    <span id="quiz-title" class="text-indigo-600 font-bold text-lg">단어 스펠링 테스트</span>
                    <span id="quiz-progress" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-semibold">1 / 20</span>
                </div>
                <div class="text-center py-6">
                    <p class="text-sm text-slate-500 mb-2">제시된 우리말 뜻에 맞는 영단어를 소문자로 입력하세요.</p>
                    <h3 id="quiz-meaning" class="text-2xl font-bold text-slate-800 min-h-[3.5rem] flex items-center justify-center">뜻</h3>
                </div>
                <form onsubmit="checkQuizAnswer(event)" class="space-y-4">
                    <input type="text" id="quiz-input" autocomplete="off" placeholder="소문자 철자 입력..." class="w-full text-center text-xl font-bold p-3.5 border-2 border-slate-200 rounded-xl focus:border-indigo-600 focus:outline-none">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition">확인 (Enter)</button>
                </form>
                <div id="quiz-feedback" class="mt-4 text-center font-bold h-6 text-sm"></div>
            </div>

            <!-- Quiz Result & Score Submit Form -->
            <div id="quiz-result" class="hidden text-center py-4">
                <div class="text-4xl mb-2">🎉</div>
                <h3 class="text-2xl font-bold text-slate-800 mb-1">테스트 완료!</h3>
                <p id="result-score-text" class="text-lg font-bold text-indigo-600 mb-6">총 10문제 중 9문제 맞힘 (90점)</p>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-left mb-6">
                    <label class="block text-xs font-bold text-slate-500 mb-2">이름 선택 후 점수를 기록하세요:</label>
                    <select id="student-select" class="w-full p-3 bg-white border border-slate-300 rounded-xl font-bold text-slate-700 focus:outline-none focus:border-indigo-600">
                        <!-- Dynamic Student Options -->
                    </select>
                </div>

                <button onclick="submitScoreRecord()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition">
                    점수 저장 및 제출하기
                </button>
            </div>

        </div>
    </div>

    <script>
        // Default Data Structure
        let state = {
            adminMode: false,
            adminView: 'content', // 'content' | 'students' | 'history'
            currentTopTab: 'voca',
            currentSidebarCat: 'middle_exam',
            currentFolderId: null,
            
            topTabs: [
                { id: 'voca', name: '단어' },
                { id: 'passage', name: '본문' },
                { id: 'video', name: '영상학습훈련' }
            ],
            
            sidebarCats: [
                { id: 'middle_exam', name: '중등부 내신문제' },
                { id: 'high_exam', name: '고등부 내신문제' },
                { id: 'mock_exam', name: '고1/고2/고3 모의고사' },
                { id: 'grammar', name: '문법' },
                { id: 'voca_cat', name: '단어' }
            ],

            students: [
                { id: 's1', name: '김철수', grade: '중학교 1학년' },
                { id: 's2', name: '이영희', grade: '중학교 2학년' }
            ],

            historyRecords: [
                { id: 'h1', studentName: '김철수', title: '중1 천재(이상기) - Lesson 5', score: 100, correct: 6, total: 6, date: '2026-10-15 14:20' }
            ],

            database: {
                'middle_exam': [
                    { id: 'f_m1', type: 'folder', name: '중1 천재(이상기) (22개정)', parentId: null },
                    { id: 'f_m2', type: 'folder', name: '중2 천재(소영순) (22개정)', parentId: null },
                    { id: 'file_m1_5', type: 'file', name: 'Lesson 5 단어 스펠링 테스트', parentId: 'f_m1', wordDataKey: 'm1-5' },
                    { id: 'file_m1_6', type: 'file', name: 'Lesson 6 단어 스펠링 테스트', parentId: 'f_m1', wordDataKey: 'm1-6' },
                    { id: 'file_m2_7', type: 'file', name: 'Lesson 7 단어 스펠링 테스트', parentId: 'f_m2', wordDataKey: 'm2-7' }
                ],
                'high_exam': [
                    { id: 'f_h1', type: 'folder', name: '고1 영어 (지학사)', parentId: null }
                ],
                'mock_exam': [],
                'grammar': [],
                'voca_cat': []
            }
        };

        const wordsDataMap = {
            'm1-5': [
                { word: "tomorrow", meaning: "내일" }, { word: "weekend", meaning: "주말" },
                { word: "beautiful", meaning: "아름다운" }, { word: "visit", meaning: "방문하다" },
                { word: "excited", meaning: "신이 난" }, { word: "dolphin", meaning: "돌고래" }
            ],
            'm1-6': [
                { word: "think", meaning: "생각하다" }, { word: "friendly", meaning: "친근한" },
                { word: "painting", meaning: "그림" }, { word: "nature", meaning: "자연" }
            ],
            'm2-7': [
                { word: "photo", meaning: "사진" }, { word: "hiking", meaning: "하이킹" },
                { word: "sunset", meaning: "일몰" }, { word: "visitor", meaning: "방문객" }
            ]
        };

        // Local Storage
        function loadSavedState() {
            const saved = localStorage.getItem('cm_academy_portal_v2');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.topTabs = parsed.topTabs || state.topTabs;
                    state.sidebarCats = parsed.sidebarCats || state.sidebarCats;
                    state.database = parsed.database || state.database;
                    state.students = parsed.students || state.students;
                    state.historyRecords = parsed.historyRecords || state.historyRecords;
                } catch(e) {}
            }
        }

        function saveState() {
            localStorage.setItem('cm_academy_portal_v2', JSON.stringify({
                topTabs: state.topTabs,
                sidebarCats: state.sidebarCats,
                database: state.database,
                students: state.students,
                historyRecords: state.historyRecords
            }));
        }

        // Admin Mode Toggle
        function toggleAdminMode() {
            state.adminMode = !state.adminMode;
            const btn = document.getElementById('admin-btn');
            btn.innerHTML = state.adminMode ? '⚙️ <span>관리자 모드 (On)</span>' : '⚙️ <span>관리자 모드 (Off)</span>';
            btn.className = state.adminMode 
                ? 'bg-rose-600 hover:bg-rose-700 text-white text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-bold shadow-md'
                : 'bg-slate-800 hover:bg-slate-900 text-white text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-bold';

            document.querySelectorAll('.admin-only').forEach(el => {
                if (state.adminMode) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });

            if (!state.adminMode) switchAdminView('content');
            renderAll();
        }

        function switchAdminView(view) {
            state.adminView = view;
            document.getElementById('view-content').classList.add('hidden');
            document.getElementById('view-students').classList.add('hidden');
            document.getElementById('view-history').classList.add('hidden');

            document.getElementById('admin-view-content-btn').className = "flex-1 py-2 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900";
            document.getElementById('admin-view-students-btn').className = "flex-1 py-2 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900";
            document.getElementById('admin-view-history-btn').className = "flex-1 py-2 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900";

            if (view === 'content') {
                document.getElementById('view-content').classList.remove('hidden');
                document.getElementById('admin-view-content-btn').className = "flex-1 py-2 rounded-lg text-xs font-bold bg-white text-indigo-600 shadow-sm";
            } else if (view === 'students') {
                document.getElementById('view-students').classList.remove('hidden');
                document.getElementById('admin-view-students-btn').className = "flex-1 py-2 rounded-lg text-xs font-bold bg-white text-indigo-600 shadow-sm";
                renderStudents();
            } else if (view === 'history') {
                document.getElementById('view-history').classList.remove('hidden');
                document.getElementById('admin-view-history-btn').className = "flex-1 py-2 rounded-lg text-xs font-bold bg-white text-indigo-600 shadow-sm";
                renderHistory();
            }
        }

        // Render Functions
        function renderTopNav() {
            const container = document.getElementById('top-nav-container');
            container.innerHTML = '';

            state.topTabs.forEach(tab => {
                const isActive = state.currentTopTab === tab.id;
                const btn = document.createElement('div');
                btn.className = 'flex items-center gap-1';
                
                const tabBtn = document.createElement('button');
                tabBtn.className = isActive
                    ? 'bg-indigo-700 text-white px-4 py-2 rounded-xl shadow-sm transition'
                    : 'bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl transition';
                tabBtn.innerText = tab.name;
                tabBtn.onclick = () => {
                    state.currentTopTab = tab.id;
                    renderTopNav();
                };
                btn.appendChild(tabBtn);

                if (state.adminMode) {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'text-rose-500 font-bold text-xs hover:bg-rose-50 p-1 rounded';
                    delBtn.innerText = '✕';
                    delBtn.onclick = () => removeTopTab(tab.id);
                    btn.appendChild(delBtn);
                }

                container.appendChild(btn);
            });

            if (state.adminMode) {
                const addBtn = document.createElement('button');
                addBtn.className = 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100 border border-indigo-200 px-3 py-2 rounded-xl text-xs font-bold';
                addBtn.innerText = '+ 탭 추가';
                addBtn.onclick = addTopTabPrompt;
                container.appendChild(addBtn);
            }
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-container');
            container.innerHTML = '';

            state.sidebarCats.forEach(cat => {
                const isActive = state.currentSidebarCat === cat.id;
                const wrapper = document.createElement('div');
                wrapper.className = 'flex items-center justify-between group gap-1';

                const btn = document.createElement('button');
                btn.className = isActive
                    ? 'w-full text-left bg-indigo-900 text-white font-bold p-3 rounded-xl shadow-sm transition text-sm flex justify-between items-center'
                    : 'w-full text-left bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold p-3 rounded-xl transition text-sm flex justify-between items-center border border-slate-200/60';
                btn.innerHTML = `<span>${cat.name}</span> ${isActive ? '<span class="text-xs bg-indigo-700 px-2 py-0.5 rounded-full">선택됨</span>' : ''}`;
                btn.onclick = () => {
                    state.currentSidebarCat = cat.id;
                    state.currentFolderId = null;
                    if (state.adminView !== 'content') switchAdminView('content');
                    renderAll();
                };

                wrapper.appendChild(btn);

                if (state.adminMode) {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'text-rose-500 font-bold text-xs hover:bg-rose-50 p-2 rounded-lg';
                    delBtn.innerText = '🗑️';
                    delBtn.onclick = () => removeSidebarCat(cat.id);
                    wrapper.appendChild(delBtn);
                }

                container.appendChild(wrapper);
            });
        }

        function renderContent() {
            const container = document.getElementById('content-container');
            const breadcrumb = document.getElementById('breadcrumb');
            const title = document.getElementById('current-title');
            container.innerHTML = '';

            const currentCatObj = state.sidebarCats.find(c => c.id === state.currentSidebarCat);
            const catName = currentCatObj ? currentCatObj.name : '학습 자료실';

            const items = (state.database[state.currentSidebarCat] || []).filter(item => item.parentId === state.currentFolderId);

            if (state.currentFolderId) {
                const currentFolder = (state.database[state.currentSidebarCat] || []).find(f => f.id === state.currentFolderId);
                breadcrumb.innerHTML = `<span class="cursor-pointer hover:underline" onclick="navigateToFolder(null)">${catName}</span> ➔ <span>${currentFolder ? currentFolder.name : '폴더'}</span>`;
                title.innerText = currentFolder ? currentFolder.name : '자료 목록';
            } else {
                breadcrumb.innerText = catName;
                title.innerText = '폴더 및 자료 목록';
            }

            if (state.currentFolderId) {
                const backBtn = document.createElement('div');
                backBtn.className = "p-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl cursor-pointer transition text-sm flex items-center gap-2 mb-2";
                backBtn.innerHTML = `<span>⬆️ 상위 폴더로 이동</span>`;
                backBtn.onclick = () => navigateToFolder(null);
                container.appendChild(backBtn);
            }

            if (items.length === 0) {
                container.innerHTML += `<div class="text-center py-12 text-slate-400 font-medium text-sm">등록된 폴더나 자료가 없습니다. (관리자 모드에서 추가 가능)</div>`;
                return;
            }

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = "p-4 bg-slate-50 border border-slate-200 hover:border-indigo-400 rounded-xl transition flex justify-between items-center font-bold text-slate-700 text-sm";
                
                if (item.type === 'folder') {
                    row.innerHTML = `
                        <div class="flex items-center gap-2.5 cursor-pointer" onclick="navigateToFolder('${item.id}')">
                            <span class="text-xl">📂</span>
                            <span class="hover:text-indigo-600">${item.name}</span>
                        </div>
                    `;
                } else {
                    row.innerHTML = `
                        <div class="flex items-center gap-2.5">
                            <span class="text-xl">📄</span>
                            <span>${item.name}</span>
                        </div>
                    `;
                }

                const rightBox = document.createElement('div');
                rightBox.className = 'flex items-center gap-2';

                if (item.type === 'file') {
                    const actionBtn = document.createElement('button');
                    actionBtn.className = "bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-lg shadow-sm transition";
                    actionBtn.innerText = "학습 시작 ➔";
                    actionBtn.onclick = () => openQuiz(item.wordDataKey || 'm1-5', item.name);
                    rightBox.appendChild(actionBtn);
                } else {
                    const enterBtn = document.createElement('button');
                    enterBtn.className = "bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-lg transition";
                    enterBtn.innerText = "열기 ➔";
                    enterBtn.onclick = () => navigateToFolder(item.id);
                    rightBox.appendChild(enterBtn);
                }

                if (state.adminMode) {
                    const delBtn = document.createElement('button');
                    delBtn.className = "text-rose-500 font-bold text-xs hover:bg-rose-100 p-1.5 rounded-lg";
                    delBtn.innerText = "삭제";
                    delBtn.onclick = () => deleteItem(item.id);
                    rightBox.appendChild(delBtn);
                }

                row.appendChild(rightBox);
                container.appendChild(row);
            });
        }

        // Student Management Render
        function renderStudents() {
            const container = document.getElementById('student-list-container');
            container.innerHTML = '';

            if (state.students.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium text-sm">등록된 학생이 없습니다. 신규 학생을 등록하세요.</div>`;
                return;
            }

            state.students.forEach(s => {
                const card = document.createElement('div');
                card.className = "p-4 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-800 text-base">${s.name}</div>
                        <div class="text-xs text-slate-400 mt-0.5">${s.grade}</div>
                    </div>
                    <button onclick="removeStudent('${s.id}')" class="text-rose-600 hover:bg-rose-50 text-xs px-2.5 py-1.5 rounded-lg font-bold border border-rose-200 transition">
                        학생 삭제
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // Student History Render
        function renderHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';

            if (state.historyRecords.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 font-medium text-sm">아직 기록된 학생 학습 이력이 없습니다.</div>`;
                return;
            }

            state.historyRecords.slice().reverse().forEach(h => {
                const row = document.createElement('div');
                row.className = "p-4 bg-slate-50 border border-slate-200 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2";
                row.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-slate-800 text-base">${h.studentName}</span>
                            <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold">${h.score}점</span>
                        </div>
                        <div class="text-sm text-slate-600 font-medium">${h.title} (${h.correct} / ${h.total} 정답)</div>
                        <div class="text-xs text-slate-400 mt-1">학습 완료 일시: ${h.date}</div>
                    </div>
                    <button onclick="deleteHistoryItem('${h.id}')" class="text-slate-400 hover:text-rose-600 text-xs font-bold">기록 삭제</button>
                `;
                container.appendChild(row);
            });
        }

        function renderAll() {
            renderTopNav();
            renderSidebar();
            if (state.adminView === 'content') renderContent();
            else if (state.adminView === 'students') renderStudents();
            else if (state.adminView === 'history') renderHistory();
            saveState();
        }

        // Navigation
        function navigateToFolder(folderId) {
            state.currentFolderId = folderId;
            renderContent();
        }

        function resetToHome() {
            state.currentSidebarCat = 'middle_exam';
            state.currentFolderId = null;
            if (state.adminView !== 'content') switchAdminView('content');
            renderAll();
        }

        // Admin Prompt Handlers
        function addStudentPrompt() {
            const name = prompt('등록할 학생 이름을 입력하세요:');
            if (name) {
                const grade = prompt('학년을 입력하세요 (예: 중학교 1학년):', '중학교 1학년');
                state.students.push({
                    id: 's_' + Date.now(),
                    name: name.trim(),
                    grade: grade ? grade.trim() : '미지정'
                });
                renderStudents();
                saveState();
            }
        }

        function removeStudent(id) {
            if (confirm('해당 학생을 삭제하시겠습니까?')) {
                state.students = state.students.filter(s => s.id !== id);
                renderStudents();
                saveState();
            }
        }

        function clearHistoryConfirm() {
            if (confirm('전체 학생의 학습 이력을 모두 삭제하시겠습니까?')) {
                state.historyRecords = [];
                renderHistory();
                saveState();
            }
        }

        function deleteHistoryItem(id) {
            state.historyRecords = state.historyRecords.filter(h => h.id !== id);
            renderHistory();
            saveState();
        }

        function addTopTabPrompt() {
            const name = prompt('새로 추가할 상단 탭 이름을 입력하세요:');
            if (name) {
                const id = 'tab_' + Date.now();
                state.topTabs.push({ id, name });
                renderAll();
            }
        }

        function removeTopTab(id) {
            if (confirm('이 상단 탭을 삭제하시겠습니까?')) {
                state.topTabs = state.topTabs.filter(t => t.id !== id);
                if (state.currentTopTab === id) state.currentTopTab = state.topTabs[0]?.id || null;
                renderAll();
            }
        }

        function addSidebarCategoryPrompt() {
            const name = prompt('새로 추가할 사이드바 카테고리 이름을 입력하세요:');
            if (name) {
                const id = 'cat_' + Date.now();
                state.sidebarCats.push({ id, name });
                state.database[id] = [];
                renderAll();
            }
        }

        function removeSidebarCat(id) {
            if (confirm('이 카테고리와 내부 모든 폴더/자료가 삭제됩니다. 계속하시겠습니까?')) {
                state.sidebarCats = state.sidebarCats.filter(c => c.id !== id);
                delete state.database[id];
                if (state.currentSidebarCat === id) state.currentSidebarCat = state.sidebarCats[0]?.id || null;
                renderAll();
            }
        }

        function addFolderPrompt() {
            const name = prompt('새로 만들 폴더 이름을 입력하세요:');
            if (name) {
                if (!state.database[state.currentSidebarCat]) state.database[state.currentSidebarCat] = [];
                state.database[state.currentSidebarCat].push({
                    id: 'f_' + Date.now(),
                    type: 'folder',
                    name: name,
                    parentId: state.currentFolderId
                });
                renderContent();
                saveState();
            }
        }

        function addFilePrompt() {
            const name = prompt('새로 만들 학습 파일/자료 이름을 입력하세요:');
            if (name) {
                if (!state.database[state.currentSidebarCat]) state.database[state.currentSidebarCat] = [];
                state.database[state.currentSidebarCat].push({
                    id: 'file_' + Date.now(),
                    type: 'file',
                    name: name,
                    parentId: state.currentFolderId,
                    wordDataKey: 'm1-5'
                });
                renderContent();
                saveState();
            }
        }

        function deleteItem(itemId) {
            if (confirm('해당 항목을 삭제하시겠습니까?')) {
                state.database[state.currentSidebarCat] = state.database[state.currentSidebarCat].filter(i => i.id !== itemId);
                renderContent();
                saveState();
            }
        }

        // Quiz Logic
        let activeWords = [];
        let quizIndex = 0;
        let quizCorrectCount = 0;
        let currentQuizTitle = '';

        function openQuiz(key, title) {
            const words = wordsDataMap[key] || wordsDataMap['m1-5'];
            activeWords = [...words].sort(() => Math.random() - 0.5);
            quizIndex = 0;
            quizCorrectCount = 0;
            currentQuizTitle = title;

            document.getElementById('quiz-body').classList.remove('hidden');
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-title').innerText = title;
            document.getElementById('quiz-modal').classList.remove('hidden');
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (quizIndex >= activeWords.length) {
                finishQuiz();
                return;
            }
            const current = activeWords[quizIndex];
            document.getElementById('quiz-meaning').innerText = current.meaning;
            document.getElementById('quiz-progress').innerText = `${quizIndex + 1} / ${activeWords.length}`;
            const input = document.getElementById('quiz-input');
            input.value = '';
            input.focus();
            document.getElementById('quiz-feedback').innerText = '';
        }

        function checkQuizAnswer(e) {
            e.preventDefault();
            const input = document.getElementById('quiz-input');
            const userAns = input.value.trim().toLowerCase();
            const current = activeWords[quizIndex];
            const feedback = document.getElementById('quiz-feedback');

            if (userAns === current.word.toLowerCase()) {
                quizCorrectCount++;
                feedback.innerHTML = '<span class="text-emerald-600">정답입니다! 👍</span>';
                setTimeout(() => {
                    quizIndex++;
                    loadQuizQuestion();
                }, 400);
            } else {
                feedback.innerHTML = `<span class="text-rose-500">오답입니다. 정답: ${current.word}</span>`;
            }
        }

        function finishQuiz() {
            document.getElementById('quiz-body').classList.add('hidden');
            document.getElementById('quiz-result').classList.remove('hidden');

            const total = activeWords.length;
            const score = Math.round((quizCorrectCount / total) * 100);
            document.getElementById('result-score-text').innerText = `총 ${total}문제 중 ${quizCorrectCount}문제 맞힘 (${score}점)`;

            const select = document.getElementById('student-select');
            select.innerHTML = '';

            if (state.students.length === 0) {
                select.innerHTML = `<option value="익명 학생">등록된 학생 없음 (익명 제출)</option>`;
            } else {
                state.students.forEach(s => {
                    select.innerHTML += `<option value="${s.name}">${s.name} (${s.grade})</option>`;
                });
            }
        }

        function submitScoreRecord() {
            const select = document.getElementById('student-select');
            const studentName = select.value || '익명 학생';
            const total = activeWords.length;
            const score = Math.round((quizCorrectCount / total) * 100);

            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            state.historyRecords.push({
                id: 'h_' + Date.now(),
                studentName: studentName,
                title: currentQuizTitle,
                score: score,
                correct: quizCorrectCount,
                total: total,
                date: dateStr
            });

            saveState();
            alert(`${studentName} 학생의 점수(${score}점)가 정상 저장되었습니다!`);
            closeQuiz();
        }

        function closeQuiz() {
            document.getElementById('quiz-modal').classList.add('hidden');
        }

        // Init
        loadSavedState();
        renderAll();
    </script>
</body>
</html>
