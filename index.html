<body class="bg-slate-100 min-h-screen flex flex-col">
 
<!-- 로그인 -->
<div id="login-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-indigo-700 text-white rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-4">CM</div>
      <h1 class="text-2xl font-bold text-slate-800">최강수학메이드영어학원</h1>
      <p class="text-xs text-slate-400 mt-1">스마트 영어 학습 포털</p>
    </div>
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div><label class="block text-xs font-bold text-slate-600 mb-1.5">아이디</label>
        <input id="login-id" required placeholder="아이디 입력" autocapitalize="off" autocorrect="off" spellcheck="false" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold focus:outline-none focus:border-indigo-600"></div>
      <div><label class="block text-xs font-bold text-slate-600 mb-1.5">비밀번호</label>
        <input id="login-pw" type="password" required placeholder="비밀번호 입력" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold focus:outline-none focus:border-indigo-600"></div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-md transition">로그인</button>
    </form>
    <div id="login-error" class="mt-4 text-center text-xs font-bold text-rose-500 min-h-4"></div>
  </div>
</div>
 
<!-- 포털 -->
<div id="app" class="hidden flex-grow flex flex-col">
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div id="hd-logo" class="w-10 h-10 bg-indigo-700 rounded-xl flex items-center justify-center text-white font-bold overflow-hidden">CM</div>
        <div><h1 id="hd-name" class="font-bold text-slate-800 text-lg leading-tight"></h1><p id="hd-sub" class="text-xs text-slate-400"></p></div>
      </div>
      <div class="flex items-center gap-3">
        <span id="badge" class="text-xs bg-indigo-50 text-indigo-700 font-bold px-3 py-1.5 rounded-xl border border-indigo-100"></span>
        <button onclick="auth.signOut()" class="text-xs text-slate-500 hover:text-slate-800 font-bold border border-slate-200 px-3 py-1.5 rounded-xl">로그아웃</button>
      </div>
    </div>
  </header>
 
  <div class="max-w-[1600px] mx-auto w-full flex-grow flex flex-col md:flex-row p-4 gap-4">
    <aside class="w-full md:w-64 flex-shrink-0 flex flex-col gap-2">
      <span class="text-xs font-bold text-slate-400 px-1">학습 폴더</span>
      <div id="side" class="flex flex-col gap-1.5"></div>
    </aside>
 
    <main class="flex-grow bg-white rounded-2xl shadow-sm border border-slate-200 p-6 min-w-0">
      <div id="view-nav" class="mb-6 bg-slate-100 p-1.5 rounded-xl flex gap-2 border border-slate-200"></div>
 
      <section id="view-content">
        <div class="flex flex-wrap justify-between items-center gap-3 mb-4 pb-4 border-b border-slate-100">
          <div><div id="crumb" class="text-xs font-bold text-indigo-600 mb-1 flex flex-wrap items-center gap-1"></div>
            <h2 id="title" class="text-xl font-bold text-slate-800"></h2></div>
          <div id="tools" class="flex flex-wrap items-center gap-2"></div>
        </div>
        <div id="branch-pick" class="hidden mb-4"></div>
        <div id="note" class="mb-4 p-3 bg-indigo-50 rounded-2xl border border-indigo-100 text-xs font-bold text-indigo-900"></div>
        <div id="tabs" class="flex flex-wrap gap-2 mb-4"></div>
        <div id="list" class="space-y-3"></div>
      </section>
 
      <section id="view-students" class="hidden"></section>
      <section id="view-history" class="hidden"></section>
      <section id="view-settings" class="hidden"></section>
      <section id="view-branches" class="hidden"></section>
 
      <section id="view-import" class="hidden">
        <h2 class="text-xl font-bold text-slate-800 mb-4">백업 · 가져오기</h2>
        <button onclick="safe(exportData)" class="mb-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-5 py-3 rounded-xl shadow-md transition">📥 전체 데이터 JSON 백업 다운로드</button>
        <h3 class="text-sm font-bold text-slate-700 mb-2">백업 파일 가져오기</h3>
        <p class="text-xs text-slate-600 mb-4 max-w-xl">이 화면에서 받은 새 백업 JSON을 올리면 자료(폴더·링크·PDF 정보)와 메뉴가 복원됩니다. 이전 버전의 백업 JSON(academy_platform_backup.json)을 올리면, 기존 카테고리가 B 폴더(본원 공용)의 최상위 폴더로 옮겨집니다. 같은 파일을 다시 올려도 중복되지 않고 덮어씁니다.</p>
        <input type="file" id="import-file" accept="application/json" class="text-xs">

      <footer class="mt-8 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">© 2026 최강수학메이드영어학원. All rights reserved.</footer>
    </main>
  </div>
</div>
 
<div id="study-modal" class="hidden fixed inset-0 bg-slate-900/70 z-50 items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6">
    <h3 class="text-lg font-bold text-slate-800 mb-1">학습을 마쳤나요?</h3>
    <p id="study-info" class="text-xs text-slate-500 mb-4"></p>
    <label class="block text-xs font-bold text-slate-600 mb-1.5">학습 후 화면에 나온 점수 (0~100, 없으면 비워 두세요)</label>
    <input id="study-score" type="number" min="0" max="100" inputmode="numeric" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold mb-4">
    <div class="flex gap-2">
      <button onclick="safe(saveStudy)" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-3 rounded-xl">학습 완료 저장</button>
      <button onclick="hideStudyModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold py-3 rounded-xl">아직 학습 중</button>
    </div>
  </div>
</div>
<div id="yt-modal" class="hidden fixed inset-0 bg-slate-900/80 z-50 items-center justify-center p-4" onclick="if(event.target===this)closeYt()">
  <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full p-6 relative">
    <button onclick="closeYt()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
    <h3 id="yt-title" class="text-lg font-bold text-slate-800 mb-4 pr-8"></h3>
    <div class="aspect-video w-full rounded-xl overflow-hidden bg-black"><iframe id="yt-frame" class="w-full h-full" src="" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
  </div>
</div>
<input type="file" id="pdf-input" accept="application/pdf" class="hidden">
<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl z-50"></div>
 
<script>
/* ===== 설정: Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)의 값을 붙여넣으세요 ===== */

const FB = {
apiKey: "AIzaSyDtXLBEPEA89bst8lJWJ8ayCUJgyaf7PS4",
  authDomain: "cm-academy-8387b.firebaseapp.com",
  projectId: "cm-academy-8387b",
  storageBucket: "cm-academy-8387b.appspot.com",
  messagingSenderId: "371199594988",
  appId: "1:371199594988:web:a74f2bd1cc853d15d4f0c9"
};
const DOMAIN = '@cmacademy.com', ADMIN_ID = 'admin', MAX_STUDENTS = 10;
const FOLDERS = [
  { id: 'B', name: 'B · 본원 공용 자료' },
  { id: 'A', name: 'A · 우리 지점 전용' },
  { id: 'C', name: 'C · 수학' },
  { id: 'D', name: 'D · 국어' },
  { id: 'E', name: 'E · 전과목 통합' }
];
let TABS = [['video', '영상학습훈련'], ['voca', '단어'], ['passage', '본문']];
const tabOf = i => { const t = i.tabId || 'video'; return TABS.some(x => x[0] === t) ? t : TABS[0][0]; };
 
const $ = id => document.getElementById(id);
const configured = !FB.apiKey.startsWith('YOUR');
if (configured) firebase.initializeApp(FB);
const auth = configured ? firebase.auth() : null;
const db = configured ? firebase.firestore() : null;
const st = configured ? firebase.storage() : null;
// 관리자 로그인 상태를 유지한 채 새 계정을 만들기 위한 보조 앱
const auth2 = configured ? firebase.initializeApp(FB, 'sec').auth() : null;
 
const S = { me: null, view: 'content', folder: 'B', folderId: null, tab: 'video', items: [], branches: [], viewBranch: 'main', stuBranch: 'main', pdfTitle: '', hqLogo: '', hqLogoPath: '', hFilter: '' };
 
function h(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function btn(txt, cls, fn) { const b = h('button', cls, txt); b.onclick = () => safe(fn); return b; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = m => { const t = $('toast'); t.textContent = m; t.classList.toggle('hidden', !m); };
const safe = async f => { try { await f(); } catch (e) { toast(''); alert(e.message || '오류가 발생했습니다.'); } };
const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'ko', { numeric: true });
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
const B1 = 'bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-xl font-bold shadow-sm transition';
const B2 = 'bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-2 rounded-xl font-bold transition';
const branchName = id => id === 'main' ? '본원' : ((S.branches.find(b => b.id === id) || {}).academyName || id);
 
/* ===== 계정 생성 (Firebase Auth) ===== */
async function createAuth(id, pw) {
  if (!/^[a-z0-9._-]{3,30}$/.test(id)) throw new Error('아이디는 영문 소문자·숫자·._- 조합 3~30자로 입력하세요.');
  if (pw.length < 6) throw new Error('비밀번호는 6자리 이상이어야 합니다.');
  const email = id + DOMAIN; let uid;
  try { uid = (await auth2.createUserWithEmailAndPassword(email, pw)).user.uid; }
  catch (e) {
    if (e.code !== 'auth/email-already-in-use') throw e;
    // 삭제된 계정(프로필 없음)은 같은 비밀번호로 재등록 가능
    try { uid = (await auth2.signInWithEmailAndPassword(email, pw)).user.uid; if ((await db.collection('users').doc(uid).get()).exists) uid = null; } catch (_) { uid = null; }
    if (!uid) { await auth2.signOut().catch(() => {}); throw new Error('이미 사용 중인 아이디입니다.'); }
  }
  await auth2.signOut();
  return uid;
}
 
/* ===== 로그인 ===== */
const setErr = m => { $('login-error').textContent = m; };
async function handleLogin(e) {
  e.preventDefault();
  if (!configured) return setErr('index.html 상단의 Firebase 설정값(FB)을 먼저 입력하세요.');
  setErr('');
  const id = $('login-id').value.trim().toLowerCase(), pw = $('login-pw').value;
try { await auth.signInWithEmailAndPassword(id + DOMAIN, pw); }
  catch (x) { setErr('아이디 또는 비밀번호가 올바르지 않습니다.'); }
}
if (configured) auth.onAuthStateChanged(async u => {
  if (!u) { S.me = null; $('login-screen').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  try {
    let p;
    if (u.email === ADMIN_ID + DOMAIN) {
      p = { role: 'super', name: '본원 관리자', branchId: 'main' };
      await db.collection('users').doc(u.uid).set({ role: 'super', name: p.name, loginId: ADMIN_ID, branchId: 'main' }, { merge: true });
    } else {
      const d = await db.collection('users').doc(u.uid).get();
      if (!d.exists) { await auth.signOut(); return setErr('삭제되었거나 등록되지 않은 계정입니다.'); }
      p = d.data();
    }
    S.me = { uid: u.uid, ...p };
    if (p.role !== 'super') {
      const b = await db.collection('branches').doc(p.branchId).get();
      S.me.academyName = b.exists ? b.data().academyName : '최강수학메이드영어학원';
      S.me.logoUrl = b.exists ? (b.data().logoUrl || '') : ''; S.me.logoPath = b.exists ? (b.data().logoPath || '') : '';
    }
    try { const c = await db.collection('config').doc('main').get(); if (c.exists) { S.hqLogo = c.data().logoUrl || ''; S.hqLogoPath = c.data().logoPath || ''; if (c.data().tabs && c.data().tabs.length) TABS = c.data().tabs.map(t => [t.id, t.name]); } } catch (_) {}
    if (p.role === 'super') await loadBranches();
    enterPortal();
  } catch (e) { await auth.signOut(); setErr('로그인 처리 중 오류: ' + e.message); }
});
 
function enterPortal() {
  const m = S.me;
  $('login-screen').classList.add('hidden'); $('app').classList.remove('hidden');
  $('hd-name').textContent = m.role === 'super' ? '최강수학메이드영어학원 본원 관리센터' : m.academyName;
  $('hd-sub').textContent = { super: '전체 관리', sub: '지점 관리자 모드', student: '학생 학습관' }[m.role];
  $('badge').textContent = m.role === 'super' ? '👑 최고 관리자' : m.role === 'sub' ? '🏛️ ' + m.academyName + ' 원장님' : '👨‍🎓 ' + m.name + ' 학생';
  S.folder = 'B'; S.folderId = null; S.viewBranch = 'main'; S.stuBranch = 'main'; S.tab = TABS[0][0]; drawLogo(); setTimeout(showStudyModal, 600);
  buildSide(); setView('content');
}
 
async function loadBranches() {
  const s = await db.collection('branches').get();
  S.branches = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byName.bind(null));
  S.branches.sort((a, b) => (a.academyName || '').localeCompare(b.academyName || '', 'ko'));
}
 
/* ===== 내비게이션 ===== */
function buildSide() {
  const c = $('side'); c.innerHTML = '';
  FOLDERS.forEach(f => {
    const on = S.folder === f.id;
    c.append(btn(f.name, 'w-full text-left font-bold p-3 rounded-xl text-sm border transition ' + (on ? 'bg-indigo-900 text-white border-indigo-900' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'), async () => {
      S.folder = f.id; S.folderId = null; buildSide(); setView('content');
    }));
  });
}
function setView(v) {
  S.view = v;
  ['content', 'students', 'history', 'settings', 'branches', 'import'].forEach(x => $('view-' + x).classList.toggle('hidden', x !== v));
  $('side').parentElement.classList.toggle('hidden', v !== 'content');
  const views = [['content', '📂 학습 자료실']];
  if (S.me.role !== 'student') views.push(['students', '👨‍🎓 학생 관리'], ['history', '📊 학습 이력']);
  if (S.me.role !== 'student') views.push(['settings', S.me.role === 'sub' ? '⚙️ 학원 설정' : '⚙️ 본원 로고']);
  if (S.me.role === 'super') views.push(['branches', '🏛️ 지점 관리'], ['import', '💾 백업·가져오기']);
  const nav = $('view-nav'); nav.innerHTML = '';
  nav.classList.toggle('hidden', views.length < 2);
  views.forEach(([id, label]) => nav.append(btn(label, 'flex-1 py-2 rounded-lg text-xs font-bold ' + (v === id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'), () => setView(id))));
  safe(async () => { if (v === 'content') await renderContent(); else if (v === 'students') await renderStudents(); else if (v === 'branches') await renderBranches(); else if (v === 'history') await renderHistory(); else if (v === 'settings') renderSettings(); });
}
 
/* ===== 학습 자료 ===== */
const isEdit = () => S.me.role === 'super' || (S.me.role === 'sub' && S.folder === 'A');
const curBranch = () => S.me.role === 'super' ? S.viewBranch : S.me.branchId;
 
async function loadItems() {
  let q = db.collection('items').where('folder', '==', S.folder);
  if (S.folder === 'A') {
    q = q.where('branchId', '==', curBranch());
    if (S.me.role === 'student') q = q.where('visible', '==', true);
  }
  S.items = (await q.get()).docs.map(d => ({ id: d.id, ...d.data() }));
}
async function renderContent() { toast('불러오는 중...'); await loadItems(); toast(''); drawContent(); }
 
function drawContent() {
  const f = FOLDERS.find(x => x.id === S.folder), edit = isEdit();
  // 경로
  const path = []; let cur = S.folderId;
  while (cur) { const it = S.items.find(i => i.id === cur); if (!it) break; path.unshift(it); cur = it.parentId || null; }
  const crumb = $('crumb'); crumb.innerHTML = '';
  const root = h('span', 'cursor-pointer hover:underline', '📁 ' + f.name); root.onclick = () => { S.folderId = null; drawContent(); }; crumb.append(root);
  path.forEach(p => { crumb.append(h('span', 'text-slate-400', '＞')); const s = h('span', 'cursor-pointer hover:underline', p.name); s.onclick = () => { S.folderId = p.id; drawContent(); }; crumb.append(s); });
  $('title').textContent = path.length ? path[path.length - 1].name : f.name;
 
  // 안내문
  const notes = {
    B: '본원 공용 자료입니다. 모든 지점과 학생에게 공유되며 PDF 자료는 열어서 인쇄할 수 있습니다.',
    A: S.me.role === 'student' ? '우리 지점에서 공개한 자료입니다.' : '우리 지점 전용 폴더입니다. 자료마다 학생 공개/비공개를 정할 수 있고, 새 자료는 비공개로 시작합니다.',
    C: '수학 전용 폴더입니다.', D: '국어 전용 폴더입니다.', E: '전과목 통합 폴더입니다.'
  };
  $('note').textContent = '💡 ' + notes[S.folder];
 
  // 슈퍼관리자: A 폴더에서 지점 선택
  const bp = $('branch-pick'); bp.innerHTML = '';
  bp.classList.toggle('hidden', !(S.me.role === 'super' && S.folder === 'A'));
  if (S.me.role === 'super' && S.folder === 'A') {
    bp.append(h('span', 'text-xs font-bold text-slate-600 mr-2', '지점 선택'));
    const sel = h('select', 'p-2 border border-slate-300 rounded-xl text-xs font-bold');
    [{ id: 'main', academyName: '본원' }, ...S.branches].forEach(b => { const o = h('option', '', b.academyName); o.value = b.id; sel.append(o); });
    sel.value = S.viewBranch;
    sel.onchange = () => { S.viewBranch = sel.value; S.folderId = null; safe(renderContent); };
    bp.append(sel);
  }
 
  // 도구
  const tools = $('tools'); tools.innerHTML = '';
  if (edit) {

  if (sup) { try { (await db.collection('history').where('ts', '<', cut).limit(400).get()).docs.forEach(d => { if (!old.some(o => o.id === d.id)) old.push(d); }); } catch (_) {} }
  for (let i = 0; i < old.length; i += 400) { const b = db.batch(); old.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit().catch(() => {}); }
  let rec = snap.docs.filter(d => d.data().ts >= cut).map(d => d.data()).sort((a, b) => b.ts - a.ts);
  const names = [...new Set(rec.map(r => r.studentName).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
  const flt = names.includes(S.hFilter) ? S.hFilter : ''; S.hFilter = flt;
  if (flt) rec = rec.filter(r => r.studentName === flt);
  const v = $('view-history'); v.innerHTML = '';
  const top = h('div', 'flex flex-wrap justify-between items-center gap-3 mb-2 pb-4 border-b border-slate-100');
  const left = h('div', 'flex flex-wrap items-center gap-3');
  left.append(h('h2', 'text-xl font-bold text-slate-800', '학생 학습 이력'));
  const sel = h('select', 'p-2 border border-slate-300 rounded-xl text-xs font-bold');
  [''].concat(names).forEach(n => { const o = h('option', '', n || '전체 학생'); o.value = n; sel.append(o); });
  sel.value = flt; sel.onchange = () => { S.hFilter = sel.value; safe(renderHistory); }; left.append(sel);
  top.append(left, btn('+ 점수 입력', B1, addScore));
  v.append(top, h('p', 'text-xs text-slate-400 mb-4', '학습 이력은 30일 동안 보관되고 이후 자동 삭제됩니다.'));
  if (!rec.length) v.append(h('div', 'text-center py-12 text-slate-400 text-sm', '학습 이력이 없습니다. 학생이 자료를 열면 시작 시각이 자동으로 기록됩니다.'));
  const days = {}; rec.forEach(r => { (days[r.day || dayOf(r.ts)] ||= []).push(r); });
  Object.keys(days).sort().reverse().forEach(day => {
    v.append(h('h3', 'text-sm font-bold text-indigo-700 mt-5 mb-2', day + ' · ' + days[day].length + '건'));
    days[day].forEach(r => v.append(histRow(r, sup)));
  });
}
async function addScore() {
  const bid = S.me.role === 'super' ? S.stuBranch : S.me.uid;
  const name = (prompt('학생 이름 (' + branchName(bid) + ' 기록):') || '').trim(); if (!name) return;
  const title = (prompt('시험/학습 제목:') || '').trim(); if (!title) return;
  const total = parseInt(prompt('전체 문항 수:', '20'), 10), correct = parseInt(prompt('맞힌 문항 수:'), 10);
  if (!(total > 0) || !(correct >= 0) || correct > total) return alert('문항 수를 올바르게 입력하세요.');
  const now = Date.now();
  await db.collection('history').add({ branchId: bid, studentName: name, title, kind: 'score', correct, total, score: Math.round(correct / total * 100), ts: now, day: dayOf(now), expireAt: firebase.firestore.Timestamp.fromMillis(now + KEEP) });
  await renderHistory();
}
 
/* ===== 학원 설정 (지점장) ===== */
function drawLogo() {
  const u = S.me.role === 'super' ? S.hqLogo : (S.me.logoUrl || S.hqLogo), box = $('hd-logo'); box.innerHTML = '';
  if (u) { const i = h('img', 'w-full h-full object-contain'); i.src = u; i.alt = '학원 로고'; box.append(i); } else box.textContent = 'CM';
}
async function pdfToPng(file) {
  if (!window.pdfjsLib) throw new Error('PDF 변환 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.');
  if (file.size > 10 * 1024 * 1024) throw new Error('PDF 로고 파일은 10MB 이하여야 합니다.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pg = await pdf.getPage(1), v0 = pg.getViewport({ scale: 1 });
  const vp = pg.getViewport({ scale: Math.min(4, 600 / Math.max(v0.width, v0.height)) });
  const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  await pg.render({ canvasContext: ctx, viewport: vp }).promise;
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) throw new Error('PDF를 이미지로 변환하지 못했습니다.');
  return new File([blob], file.name.replace(/\.pdf$/i, '') + '.png', { type: 'image/png' });
}
async function setLogo(file) {
  if (file && file.type === 'application/pdf') { toast('PDF 변환 중...'); file = await pdfToPng(file); toast(''); }
  if (file) {
    if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error('PNG, JPG, WEBP, GIF 이미지 또는 PDF 파일만 올릴 수 있습니다.');
    if (file.size > 1024 * 1024) throw new Error('로고 파일은 1MB 이하여야 합니다.');
  }
  const sup = S.me.role === 'super', id = sup ? 'main' : S.me.uid, oldPath = sup ? S.hqLogoPath : S.me.logoPath;
  let url = '', path = '';
  if (file) {
    toast('로고 업로드 중...');
    const ref = st.ref('logo/' + id + '/' + Date.now() + '_' + file.name.replace(/[^\w.-]/g, '_'));
    await ref.put(file, { contentType: file.type }); url = await ref.getDownloadURL(); path = ref.fullPath;
  }
  if (sup) { await db.collection('config').doc('main').set({ logoUrl: url, logoPath: path }, { merge: true }); S.hqLogo = url; S.hqLogoPath = path; }
  else { await db.collection('branches').doc(id).update({ logoUrl: url, logoPath: path }); S.me.logoUrl = url; S.me.logoPath = path; }
  if (oldPath) st.ref(oldPath).delete().catch(() => {});
  toast(''); drawLogo(); renderSettings();
}
function renderSettings() {
  const sup = S.me.role === 'super', v = $('view-settings'); v.innerHTML = '';
  v.append(h('h2', 'text-xl font-bold text-slate-800 mb-4', sup ? '본원 로고 설정' : '학원 설정'));
  const box = h('div', 'bg-slate-50 p-6 rounded-2xl border border-slate-200 max-w-xl space-y-4');
  if (!sup) {
    const inp = h('input', 'w-full p-3 bg-white border border-slate-300 rounded-xl font-bold text-slate-800'); inp.value = S.me.academyName || ''; inp.maxLength = 40;
    box.append(h('label', 'block text-xs font-bold text-slate-600', '학원명'), inp, btn('학원명 저장하기', 'w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition', async () => {
      const n = inp.value.trim(); if (!n) return alert('학원명을 입력하세요.');
      const b = db.batch(); b.update(db.collection('branches').doc(S.me.uid), { academyName: n }); b.update(db.collection('users').doc(S.me.uid), { academyName: n, name: n }); await b.commit();
      S.me.academyName = n; $('hd-name').textContent = n; $('badge').textContent = '🏛️ ' + n + ' 원장님'; alert('학원명이 저장되었습니다.');
    }));
  }
  box.append(h('label', 'block text-xs font-bold text-slate-600', sup ? '본원 로고 (로고가 없는 지점의 기본 로고로도 쓰입니다)' : '학원 로고 (PNG·JPG·WEBP·GIF 1MB 이하, 또는 PDF 첫 페이지)'));
  const cur = sup ? S.hqLogo : S.me.logoUrl;
  const pv = h('div', 'w-20 h-20 rounded-2xl bg-indigo-700 text-white font-bold text-xl flex items-center justify-center overflow-hidden');
  if (cur) { const i = h('img', 'w-full h-full object-contain'); i.src = cur; i.alt = '로고'; pv.append(i); } else pv.textContent = 'CM';
  const fi = h('input', 'text-xs'); fi.type = 'file'; fi.accept = 'image/png,image/jpeg,image/webp,image/gif,application/pdf';
  fi.onchange = () => { const f = fi.files[0]; fi.value = ''; if (f) safe(() => setLogo(f)); };
  box.append(pv, fi);
  if (cur) box.append(btn('로고 삭제', B2, () => setLogo(null)));
  v.append(box);
}
 
/* ===== 지점 삭제 / 전체 백업 ===== */
async function delQuery(q) {
  const docs = (await q.get()).docs;
  for (let i = 0; i < docs.length; i += 400) { const b = db.batch(); docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
  return docs.map(d => d.data());
}
async function delBranch(b) {
  if (!confirm('"' + b.academyName + '" 지점을 삭제할까요?\n이 지점의 학생 계정, 지점 전용(A) 자료, 학습 이력이 모두 삭제되며 되돌릴 수 없습니다.\n(삭제 전에 백업을 받아 두세요)')) return;
  if (prompt('확인을 위해 지점 아이디를 입력하세요: ' + b.loginId) !== b.loginId) return alert('아이디가 일치하지 않아 취소했습니다.');
  toast('삭제 중...'); if (b.logoPath) st.ref(b.logoPath).delete().catch(() => {});
  const items = await delQuery(db.collection('items').where('folder', '==', 'A').where('branchId', '==', b.id));
  for (const t of items) if (t.pdfPath) st.ref(t.pdfPath).delete().catch(() => {});
  await delQuery(db.collection('users').where('branchId', '==', b.id).where('role', '==', 'student'));
  await delQuery(db.collection('history').where('branchId', '==', b.id));
  const bt = db.batch(); bt.delete(db.collection('users').doc(b.id)); bt.delete(db.collection('branches').doc(b.id)); await bt.commit();
  toast(''); S.stuBranch = 'main'; S.viewBranch = 'main'; await renderBranches();
}
async function exportData() {
  toast('백업 생성 중...');
  const out = { exportedAt: new Date().toISOString(), tabs: TABS.map(([id, name]) => ({ id, name })) };
  for (const c of ['items', 'branches', 'users', 'history']) out[c] = (await db.collection(c).get()).docs.map(d => ({ id: d.id, ...d.data() }));
  const a = h('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = 'academy_backup_' + new Date().toISOString().slice(0, 10) + '.json'; document.body.append(a); a.click(); a.remove(); toast('');
}
